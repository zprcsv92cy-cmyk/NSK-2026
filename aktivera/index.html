<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Aktivera konto – NSK</title><script src="../version.js?v=872"></script><script>document.write('<link rel="stylesheet" href="../app.css?v='+window.NSK_VERSION+'">');document.write('<script src="../config.js?v='+window.NSK_VERSION+'"><\/script>');</script><style>main{max-width:480px;margin:3rem auto;padding:1.5rem}form,label{display:grid;gap:12px}label{gap:5px}input{width:100%;box-sizing:border-box}p[role=status]{min-height:1.5em}</style></head>
<body><main class="card"><h1 id="accessTitle">Aktivera konto</h1><p id="accessInfo">Öppna din personliga inbjudningslänk och välj ett eget lösenord. Saknar du en länk kontaktar du huvudadministratören.</p>
<form id="accountPasswordForm"><label id="manualTokenLabel">Engångskod<input id="token" type="password" autocomplete="off" minlength="43" maxlength="43"></label><label>Nytt lösenord (minst 12 tecken)<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Bekräfta nytt lösenord<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><button id="accessSubmit" type="submit" class="nsk-action nsk-action--save">Aktivera konto</button><p id="accessMessage" role="status" aria-live="polite"></p></form><a href="../login/">Till inloggningen</a></main><script>document.write('<script src="../account-access.js?v='+window.NSK_VERSION+'"><\/script>');</script></body></html>
