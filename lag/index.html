<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lag</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=864"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>
  <style>
    /* Samma kompakta NSK-logga som på Truppen, endast på denna sida. */
    .teams-page .home-hero-logo-box { flex: 0 0 72px; width: 72px; max-width: 72px; }
    .teams-page .home-hero-logo { display: block; width: 72px; max-width: 100%; height: auto; }
  </style>
</head>
<body class="teams-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/" class="active">Lag</a>
    </nav>

    <section class="home-hero">
      <div class="home-hero-logo-box">
        <img src="../icon-192.png" alt="NSK" class="home-hero-logo">
      </div>
      <div class="home-hero-text">
        <h1>Lag</h1>
        <div class="home-hero-sub">Välj lag för att öppna matchvyn för valt poolspel.</div>
      </div>
    </section>

    <section class="card">
      <div id="poolTeamEditor" class="listrow" hidden>
        <label for="poolTeamCount">Antal lag i valt poolspel (1–20)</label>
        <input id="poolTeamCount" type="number" min="1" max="20" step="1" style="width:90px;margin:0 10px">
        <button type="button" id="poolTeamSave" class="nsk-action nsk-action--save">Spara antal lag</button>
        <div id="poolTeamMessage" class="small" role="status"></div>
      </div>
      <div id="teamButtons" class="team-buttons"></div>
      <div id="activeTeam" class="listrow"></div>
    </section>

    <div id="appError" class="small"></div>
    <script>
      document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
    </script>
  </div>
<script src="../admin-mode.js?v=1"></script>
<script src="../pool-team-editor.js?v=1"></script>
</body>
</html>
