<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Logga in – NSK</title><script src="../version.js?v=872"></script>
<script>document.write('<link rel="stylesheet" href="../app.css?v='+window.NSK_VERSION+'">');document.write('<script src="../config.js?v='+window.NSK_VERSION+'"><\/script>');document.write('<script src="../auth.js?v='+window.NSK_VERSION+'"><\/script>');</script>
<style>main{max-width:460px;margin:3rem auto;padding:1.5rem}form,label{display:grid;gap:12px}label{gap:5px}input{width:100%;box-sizing:border-box}.account-links{display:flex;gap:15px;flex-wrap:wrap;margin:18px 0}p[role=status]{min-height:1.5em}</style></head>
<body><main class="card"><h1>Logga in</h1><p>Använd ditt personliga NSK-konto.</p>
<form id="loginForm"><label>E-postadress<input id="email" type="email" autocomplete="username" required></label><label>Lösenord<input id="password" type="password" autocomplete="current-password" required></label><button id="submitButton" type="submit" class="nsk-action nsk-action--primary">Logga in</button><p id="message" role="status" aria-live="polite"></p></form>
<div class="account-links"><button id="forgotOpen" type="button" class="nsk-action nsk-action--neutral" aria-expanded="false">Glömt lösenord?</button><a href="../aktivera/">Aktivera konto</a></div>
<section id="forgotPanel" hidden><h2>Glömt lösenord</h2><p id="forgotInfo">Ange din registrerade e-postadress för att begära hjälp.</p><form id="forgotForm"><label>E-postadress<input id="forgotEmail" type="email" autocomplete="email" required maxlength="254"></label><button id="forgotSubmit" type="submit" class="nsk-action nsk-action--primary">Begär lösenordshjälp</button><p id="forgotMessage" role="status" aria-live="polite"></p></form></section>
<p>Ny användare? Be huvudadministratören att skapa ett konto och ge dig en inbjudningslänk. Du väljer själv ditt lösenord.</p><a href="../startsida/">Till startsidan</a>
</main><script>document.write('<script src="../account-access.js?v='+window.NSK_VERSION+'"><\/script>');</script></body></html>
