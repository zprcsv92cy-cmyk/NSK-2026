<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in – NSK</title>
<link rel="stylesheet" href="../app.css">
<style>
main{max-width:440px;margin:3rem auto;padding:1.5rem}
form,label{display:grid;gap:12px}
label{gap:5px}
input{width:100%;box-sizing:border-box}
#message{min-height:1.5em}
</style>
</head>
<body>
<main class="card">
<h1>Logga in</h1>
<p>Logga in med ditt personliga NSK-konto. Du kan även kontrollera produktionskontot utan att spara en inloggningssession.</p>
<form id="loginForm">
<label>E-postadress<input id="email" type="email" autocomplete="username" required></label>
<label>Lösenord<input id="password" type="password" autocomplete="current-password" required></label>
<button id="submitButton" type="submit">Logga in</button>
<button id="productionButton" type="button">Kontrollera produktionskonto</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<a href="../startsida/">Till startsidan</a>
</main>
<script src="../version.js?v=872"></script>
<script>
  document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
</script>
<script>
// Never accept an external or unrecognized post-login destination.
function signedInDestination() {
 const raw = new URLSearchParams(location.search).get('next');
 const fallback = new URL('../startsida/', location.href);
 if (!raw || !raw.startsWith('/') || raw.startsWith('//') || raw.includes(String.fromCharCode(92))) return fallback.href;
 const target = new URL(raw, location.origin);
 const root = new URL('../', location.href).pathname;
 const allowed = ['startsida','truppen','skapapoolspel','malvaktsstatistik','bytesschema','matchvy','lag','laguppstallning','anvandare','mittkonto'];
 const name = target.pathname.startsWith(root) ? target.pathname.slice(root.length).split('/')[0] : '';
 if (target.origin !== location.origin || !allowed.includes(name)) return fallback.href;
 return target.href;
}
Auth.init().then(identity => { if(identity) location.replace(signedInDestination()); }).catch(() => {});
let loginBusy = false;
document.getElementById('productionButton').addEventListener('click',async()=>{
 if (loginBusy) return;
 loginBusy = true;
 const button=document.getElementById('productionButton');
 const message=document.getElementById('message');
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||!password){message.textContent='Fyll i e-postadress och lösenord.';loginBusy=false;return;}
 button.disabled=true;
 document.getElementById('submitButton').disabled=true;
 let token;
 try {
  const base='https://nsk-auth.peter-hasselberg.workers.dev';
  const response=await fetch(base+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password}),credentials:'omit',cache:'no-store'});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.token)throw new Error(data.error||'Produktionsinloggning misslyckades');
  token=data.token;
  const check=await fetch(base+'/api/auth/me',{headers:{Authorization:'Bearer '+token},credentials:'omit',cache:'no-store'});
  const identity=await check.json().catch(()=>({}));
  if(!check.ok||!identity.user)throw new Error('Produktionskontot kunde inte verifieras');
  message.textContent='Produktionskonto verifierat: '+identity.user.name+'. Ingen produktionssession sparades.';
 } catch(error){message.textContent=error.message||'Produktionskontroll misslyckades';}
 finally {
  document.getElementById('password').value='';
  if(token)await fetch('https://nsk-auth.peter-hasselberg.workers.dev/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token},credentials:'omit'}).catch(()=>{});
  button.disabled=false;
  document.getElementById('submitButton').disabled=false;
  loginBusy=false;
 }
});
document.getElementById('loginForm').addEventListener('submit',async function(event){
 event.preventDefault();
 if (loginBusy) return;
 loginBusy=true;
 const button=document.getElementById('submitButton');
 const message=document.getElementById('message');
 button.disabled=true;
 document.getElementById('productionButton').disabled=true;
 message.textContent='Kontrollerar inloggningen…';
 try{
   const email=document.getElementById('email').value.trim();
   const password=document.getElementById('password').value;
   const session=await Auth.login(email,password);
   message.textContent='Inloggad som '+session.user.name;
   location.replace(signedInDestination());
 }catch(error){
   message.textContent=error.message||'Inloggningen misslyckades';
 }finally{
   document.getElementById('password').value='';
   button.disabled=false;
   document.getElementById('productionButton').disabled=false;
   loginBusy=false;
 }
});
</script>
</body>
</html>
