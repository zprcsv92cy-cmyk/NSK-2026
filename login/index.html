<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Logga in – NSK</title><script src="../version.js?v=872"></script>
<script>document.write('<link rel="stylesheet" href="../app.css?v='+window.NSK_VERSION+'">');document.write('<script src="../config.js?v='+window.NSK_VERSION+'"><\/script>');document.write('<script src="../auth.js?v='+window.NSK_VERSION+'"><\/script>');</script>
<style>
body.login-page{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 0,rgba(177,18,38,.25),transparent 58%),#0f0f10}
.login-shell{width:100%;max-width:430px;margin:auto}.login-brand{text-align:center;margin-bottom:25px}.login-brand img{display:block;width:108px;height:108px;object-fit:contain;margin:0 auto 15px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}.login-club{font-size:clamp(22px,6vw,28px);font-weight:750;letter-spacing:-.6px;margin:0 0 10px;color:#f5f5f7}.login-team{display:inline-block;border:1px solid rgba(226,62,84,.45);border-radius:999px;padding:5px 15px;color:#ffb8c2;background:rgba(177,18,38,.15);font-size:13px;font-weight:650;letter-spacing:1.5px;text-transform:uppercase}
.login-card{padding:28px;border:1px solid #34353e;border-radius:22px;background:linear-gradient(145deg,#1e1f25,#17181b);box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:3px solid #b11226}.login-card h1{font-size:25px;letter-spacing:-.5px;margin-bottom:8px}.login-intro{font-size:14px;color:#b6b7c1;margin:0 0 25px}.login-card form,.login-card label{display:grid;gap:16px}.login-card label{gap:8px;font-size:14px;color:#dddde4}.login-card input{width:100%;box-sizing:border-box;margin:0;min-height:48px;font-size:16px;background:#111217;border-color:#3d3e48;border-radius:11px}.login-card input:focus-visible{outline:2px solid #eb536a;outline-offset:2px}.login-card button{min-height:46px}.login-card #submitButton{width:100%;border-radius:11px;font-size:16px;margin-top:4px}.login-card p[role=status]{margin:0;font-size:14px;overflow-wrap:anywhere}.login-card p[role=status]:empty{display:none}.account-links{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:20px 0 0;font-size:13px}.login-card #forgotOpen{background:none;border:0;box-shadow:none;padding:0;min-height:36px;color:#c6c7d0;font-size:13px;font-weight:500}.login-card a{color:#e0e0e7;text-underline-offset:4px}.login-card #forgotPanel{margin-top:24px;padding-top:22px;border-top:1px solid #34353e}.login-card #forgotPanel h2{font-size:19px}.login-card #forgotInfo{font-size:14px;color:#b6b7c1;line-height:1.5}.login-new{margin:23px 0 0;padding-top:20px;border-top:1px solid #34353e;color:#aaaeb9;font-size:13px;line-height:1.6}.login-back{display:block;text-align:center;margin:22px auto 0;color:#a7a7b2;font-size:13px;text-decoration:none;min-height:32px}.login-back:hover{color:#fff}@media(max-width:380px){.login-card{padding:22px}.login-brand img{width:88px;height:88px}.login-club{font-size:22px}}
</style></head>
<body class="login-page"><main class="login-shell"><header class="login-brand"><img src="../icon-192.png" alt="NSK:s klubbmärke" width="108" height="108"><p class="login-club">Nyköpings sportklubb</p><span class="login-team">Team 18</span></header><section class="card login-card" aria-labelledby="loginTitle"><h1 id="loginTitle">Logga in</h1><p class="login-intro">Välkommen till lagets samlingsplats.</p>
<form id="loginForm"><label>E-postadress<input id="email" type="email" autocomplete="username" required></label><label>Lösenord<input id="password" type="password" autocomplete="current-password" required></label><button id="submitButton" type="submit" class="nsk-action nsk-action--primary">Logga in</button><p id="message" role="status" aria-live="polite"></p></form>
<div class="account-links"><button id="forgotOpen" type="button" class="nsk-action nsk-action--neutral" aria-expanded="false">Glömt lösenord?</button><a href="../aktivera/">Aktivera konto</a></div>
<section id="forgotPanel" hidden><h2>Glömt lösenord</h2><p id="forgotInfo">Ange din registrerade e-postadress för att begära hjälp.</p><form id="forgotForm"><label>E-postadress<input id="forgotEmail" type="email" autocomplete="email" required maxlength="254"></label><button id="forgotSubmit" type="submit" class="nsk-action nsk-action--primary">Begär lösenordshjälp</button><p id="forgotMessage" role="status" aria-live="polite"></p></form></section>
<p class="login-new">Ny i laget? Be huvudadministratören om en inbjudan för att aktivera ditt konto.</p></section><a class="login-back" href="../startsida/">← Till startsidan</a>
</main><script>document.write('<script src="../account-access.js?v='+window.NSK_VERSION+'"><\/script>');</script></body></html>
