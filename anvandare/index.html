<script>document.documentElement.style.visibility='hidden';</script><script src="../login-gate.js"></script>
<style>.user-form{display:grid;gap:12px;max-width:650px}.user-form label{display:grid;gap:5px}.permission-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}.permission-list label{display:flex;align-items:center;gap:8px}.permission-list input{width:auto}.user-card{padding:18px 0;border-top:1px solid var(--line,#454550)}.user-card select{max-width:300px}.user-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.user-actions button{min-height:44px}.user-state{font-weight:700}.user-link-status{overflow-wrap:anywhere}.user-card h3{margin-bottom:6px}#status{white-space:pre-wrap}.user-card{position:relative;padding:6px 0}.user-details>summary{cursor:pointer;display:flex;align-items:center;min-height:68px;padding:8px 62px 8px 8px;list-style:none}.user-details>summary::-webkit-details-marker{display:none}.user-identity{min-width:0}.user-identity h3{font-size:16px;margin:0 0 3px}.user-identity p{font-size:12px;line-height:1.4;margin:2px 0;overflow-wrap:anywhere}.user-identity .user-state{color:var(--muted,#aeb8c5);font-weight:500}.user-details>summary:after{content:'⌄';position:absolute;right:54px;top:27px}.user-details[open]>summary:after{content:'⌃'}.user-details[open]>summary{margin-bottom:12px}.user-card .user-share{position:absolute;right:0;top:18px;display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;padding:8px}.user-link-status:empty{display:none}.user-link-status button{margin:4px 8px 4px 0}.user-link-status p{font-size:13px}.user-create>summary{cursor:pointer;font-size:18px;font-weight:700}.user-create:not([open]){padding:14px}.permission-list{gap:8px}.permission-list label{font-size:14px}
</style>
</head><body><div class="wrap"><nav class="mainmenu"></nav><header class="home-hero"><div class="home-hero-text"><h1>Användare</h1><p>Hantera konton, lagkopplingar och personliga behörigheter.</p><p id="administratorBadge"></p></div></header>
<p id="status" role="status" aria-live="polite">Kontrollerar administratörsbehörighet…</p>
<section id="userAdmin" hidden>
<details class="card user-create"><summary>Ny användare</summary><p>Skapa ett konto och en inbjudningslänk. Användaren väljer själv sitt lösenord. Kontot är låst tills inbjudan används.</p>
<form id="createUser" class="user-form"><label>Namn<input id="newName" required maxlength="150" autocomplete="name"></label><label>E-postadress<input id="newEmail" type="email" required maxlength="254" autocomplete="email"></label>
<label>Lag<select id="newTeam"><option>NSK Team 18</option></select></label><label>Lagroll<select id="newRole"><option value="viewer">Läsare</option><option value="coach">Tränare</option><option value="team_admin">Administratör</option><option value="team_manager">Lagledare</option><option value="fitness">Fysansvarig</option><option value="equipment">Materialförvaltare</option><option value="player">Spelare</option></select></label>
<fieldset><legend>Personliga behörigheter</legend><div id="newPermissions" class="permission-list"></div></fieldset><button type="submit" class="nsk-action nsk-action--save">Skapa användare</button></form></details>
<section class="card"><h2>Användare</h2><div id="members"></div></section>
</section></div>
<script>for(const file of ['auth.js','navigation.js','account-users.js'])document.write('<script src="../'+file+'?v='+window.NSK_VERSION+'"><\/script>');</script>
