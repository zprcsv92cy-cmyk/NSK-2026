<!doctype html><html lang="sv"><head>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="../icon-192.png">
<meta name="apple-mobile-web-app-title" content="NSK">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Användare – NSK</title><script src="../version.js?v=872"></script>
<script>document.write('<link rel="stylesheet" href="../app.css?v='+window.NSK_VERSION+'">');document.write('<script src="../config.js?v='+window.NSK_VERSION+'"><\/script>');</script>
<script src="../shell-entry.js"></script>
<script>document.documentElement.style.visibility='hidden';</script><script src="../login-gate.js"></script>
<style>.user-form{display:grid;gap:12px;max-width:650px}.user-form label{display:grid;gap:5px}.permission-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}.permission-list label{display:flex;align-items:center;gap:8px}.permission-list input{width:auto}.user-card{padding:18px 0;border-top:1px solid var(--line,#454550)}.user-card select{max-width:300px}.user-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.user-actions button{min-height:44px}.user-state{font-weight:700}.user-link-status{overflow-wrap:anywhere}.user-card h3{margin-bottom:6px}#status{white-space:pre-wrap}</style>
</head><body><div class="wrap"><nav class="mainmenu"></nav><header class="home-hero"><div class="home-hero-text"><h1>Användare</h1><p>Hantera konton, lagkopplingar och personliga behörigheter.</p><p id="administratorBadge"></p></div></header>
<p id="status" role="status" aria-live="polite">Kontrollerar administratörsbehörighet…</p>
<section id="userAdmin" hidden>
<section class="card"><h2>Ny användare</h2><p>Skapa ett konto och en inbjudningslänk. Användaren väljer själv sitt lösenord. Kontot är låst tills inbjudan används.</p>
<form id="createUser" class="user-form"><label>Namn<input id="newName" required maxlength="150" autocomplete="name"></label><label>E-postadress<input id="newEmail" type="email" required maxlength="254" autocomplete="email"></label>
<label>Lag<select id="newTeam"><option>NSK Team 18</option></select></label><label>Lagroll<select id="newRole"><option value="viewer">Läsare</option><option value="coach">Tränare</option><option value="team_admin">Administratör</option><option value="team_manager">Lagledare</option><option value="fitness">Fysansvarig</option><option value="equipment">Materialförvaltare</option><option value="player">Spelare</option></select></label>
<fieldset><legend>Personliga behörigheter</legend><div id="newPermissions" class="permission-list"></div></fieldset><button type="submit" class="nsk-action nsk-action--save">Skapa användare</button></form></section>
<section class="card"><h2>Registrerade användare</h2><p id="deliveryInfo"></p><label>Sök namn eller e-post<input id="userSearch" type="search" autocomplete="off"></label><div id="members"></div></section>
</section></div>
<script>for(const file of ['auth.js','navigation.js','account-users.js'])document.write('<script src="../'+file+'?v='+window.NSK_VERSION+'"><\/script>');</script>
</body></html>
