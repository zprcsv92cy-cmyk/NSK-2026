<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Startsida</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=690"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>

</head>
<body class="home-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/" class="active">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>

    <section class="home-hero">
      <div class="home-hero-logo-box">
        <img src="../icon-192.png" alt="NSK" class="home-hero-logo">
      </div>
      <div class="home-hero-text">
        <h1>Startsida</h1>
        <div class="home-hero-sub">Sparade poolspel</div>
      </div>
    </section>

    <section class="card" aria-labelledby="nsk-login-title">
      <h2 id="nsk-login-title">Användarkonto</h2>
      <p id="nsk-login-status" role="status">Kontrollerar inloggning…</p>
      <form id="nsk-login-form" hidden>
        <label for="nsk-login-email">E-postadress</label>
        <input id="nsk-login-email" type="email" autocomplete="username" required>
        <label for="nsk-login-password">Lösenord</label>
        <input id="nsk-login-password" type="password" autocomplete="current-password" required>
        <button type="submit">Logga in</button>
      </form>
      <button id="nsk-logout" type="button" hidden>Logga ut</button>
    </section>

    <section class="card home-shortcuts home-create-pool">
      <div class="home-create-intro">
        <span class="home-create-icon" aria-hidden="true">＋</span>
        <div>
          <h2>Nytt poolspel</h2>
          <p>Skapa ett poolspel och välj lag, matcher och tider.</p>
        </div>
      </div>
      <a class="home-create-button" href="../skapapoolspel/">＋ Skapa poolspel</a>
    </section>

    <section class="card home-saved">
      <h2>Sparade poolspel</h2>
      <div id="savedPoolsList"></div>
    </section>

    <div id="appError" class="small"></div>
    <script>
      document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
    </script>
  </div>
<script>
(function(){
  const form=document.getElementById('nsk-login-form');
  const status=document.getElementById('nsk-login-status');
  const logout=document.getElementById('nsk-logout');
  function display(identity){
    const signedIn=!!identity?.user;
    form.hidden=signedIn;
    logout.hidden=!signedIn;
    status.textContent=signedIn?'Inloggad som '+identity.user.name:'Logga in med ditt personliga NSK-konto.';
  }
  async function start(){
    if(!window.Auth){status.textContent='Inloggningen kunde inte startas.';return;}
    try{display(await Auth.init());}
    catch{display(null);}
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    const button=form.querySelector('button');
    button.disabled=true;status.textContent='Loggar in…';
    try{
      const identity=await Auth.login(document.getElementById('nsk-login-email').value,document.getElementById('nsk-login-password').value);
      document.getElementById('nsk-login-password').value='';
      display(identity);
    }catch(error){status.textContent=error.message||'Inloggningen misslyckades.';}
    finally{button.disabled=false;}
  });
  logout.addEventListener('click',async()=>{
    logout.disabled=true;
    try{await Auth.logout();display(null);}
    catch{status.textContent='Utloggningen kunde inte slutföras.';}
    finally{logout.disabled=false;}
  });
  start();
})();
</script>
<script src="../admin-mode.js?v=1"></script>
</body>
</html>
