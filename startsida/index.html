<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Startsida</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=812"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>

</head>
<body class="home-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/" class="active">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>

    <section class="home-hero">
      <div class="home-hero-logo-box">
        <img src="../icon-192.png" alt="NSK" class="home-hero-logo">
      </div>
      <div class="home-hero-text">
        <h1>Startsida</h1>
        <div class="home-hero-sub">Sparade poolspel</div>
      </div>
    </section>

    <section class="card" id="personalAuthPanel" aria-label="Personlig inloggning">
      <h2>Personlig inloggning</h2>
      <p id="personalAuthStatus" class="small" aria-live="polite"></p>
      <form id="personalAuthForm" hidden>
        <label>E-post <input type="email" id="personalAuthEmail" autocomplete="username" required></label>
        <label>Lösenord <input type="password" id="personalAuthPassword" autocomplete="current-password" required></label>
        <button type="submit">Logga in</button>
      </form>
      <div id="personalAuthSignedIn" hidden>
        <label>Aktivt lag <select id="personalAuthTeam"></select></label>
        <button type="button" id="personalAuthLogout">Logga ut</button>
      </div>
    </section>
    <section class="card home-shortcuts home-create-pool">
      <div class="home-create-intro">
        <span class="home-create-icon" aria-hidden="true">＋</span>
        <div>
          <h2>Nytt poolspel</h2>
          <p>Skapa ett poolspel och välj lag, matcher och tider.</p>
        </div>
      </div>
      <a class="home-create-button" href="../skapapoolspel/">＋ Skapa poolspel</a>
    </section>

    <section class="card home-saved">
      <h2>Sparade poolspel</h2>
      <div id="savedPoolsList"></div>
    </section>

    <div id="appError" class="small"></div>
    <script>
      document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
    </script>
  </div>
<script>
(() => {
  const status = document.getElementById('personalAuthStatus');
  const form = document.getElementById('personalAuthForm');
  const signedIn = document.getElementById('personalAuthSignedIn');
  const teams = document.getElementById('personalAuthTeam');
  const configured = !!window.APP_CONFIG?.AUTH_URL;
  if (!configured) {
    status.textContent = 'Personlig inloggning är under införande. Befintliga funktioner påverkas inte.';
    return;
  }
  async function refresh() {
    const identity = await Auth.init();
    form.hidden = !!identity;
    signedIn.hidden = !identity;
    if (!identity) {
      status.textContent = 'Logga in med ditt personliga konto.';
      return;
    }
    status.textContent = 'Inloggad: ' + (identity.user?.name || identity.user?.email || 'Användare');
    teams.replaceChildren();
    for (const membership of identity.memberships) {
      const option = document.createElement('option');
      option.value = membership.team_id;
      option.textContent = membership.team_name || membership.team_id;
      teams.append(option);
    }
    if (identity.memberships.length && !Auth.activeTeam()) Auth.selectTeam(identity.memberships[0].team_id);
    teams.value = Auth.activeTeam() || '';
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    status.textContent = 'Loggar in…';
    try {
      await Auth.login(document.getElementById('personalAuthEmail').value, document.getElementById('personalAuthPassword').value);
      document.getElementById('personalAuthPassword').value = '';
      await refresh();
    } catch (error) { status.textContent = error.message || 'Inloggningen misslyckades'; }
  });
  teams.addEventListener('change', () => { try { Auth.selectTeam(teams.value); } catch (error) { status.textContent = error.message; } });
  document.getElementById('personalAuthLogout').addEventListener('click', async () => { await Auth.logout(); await refresh(); });
  refresh().catch(() => { status.textContent = 'Inloggningen kunde inte kontrolleras'; });
})();
</script>
<script src="../admin-mode.js?v=1"></script>
</body>
</html>
