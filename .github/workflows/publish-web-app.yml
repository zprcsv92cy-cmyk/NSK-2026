name: Publish NSK web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'concurrency-merge.mjs'
      - '*.html'
      - '*.js'
      - 'calendar-match-plan.mjs'
      - '*.css'
      - '*.png'
      - 'slipning/**'
      - 'skills/**'
      - 'app/**'
      - 'aktivera/**'
      - 'anvandare/**'
      - 'bytesschema/**'
      - 'lag/**'
      - 'laguppstallning/**'
      - 'login/**'
      - 'malvaktsstatistik/**'
      - 'matchvy/**'
      - 'mittkonto/**'
      - 'materialforvaltare/**'
      - 'skapapoolspel/**'
      - 'startsida/**'
      - 'truppen/**'
      - 'traningsgrupper/**'
      - 'ovningsarkiv/**'
      - 'ritverktyg/**'
      - 'manifest.webmanifest'
      - 'deploy.json'
      - 'scripts/bump-version.cjs'
      - '.github/workflows/publish-web-app.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nsk-web-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing client safety and functionality tests
        run: |
          set -euo pipefail
          node --test scripts/frontend-regression-guard.test.cjs scripts/training-image-import.test.cjs
          node --check calendar-match-plan.mjs
          node --check app.js
          node --check navigation.js
          node --check shell-entry.js
          node --check app-shell.js
          node --check equipment.js
          node --check person-cards.js
          node --check sharpening-link-manager.js
          node --check sharpening-public.js
          node --check qr-code.js
          node --check skate-fields.js
          node --check private-skills.js
          node --check home-training.js
          node --check svenskalag-home.js
          node --check changing-rooms.js
          node --check calendar-list.js
          node --check training-cards.js
          node --check shared-training.js
          node --check account-access.js
          node --check account-users.js
          node --check view-cache.js
          node --check auth.js
          node --check login-gate.js
          node --check training-groups.js
          node --check exercise-archive.js
          node --check rink-drawer.js
          node --check rink-text-parser.js
          node --check exercise-rink-preview.js
          node --check hockeyakademin-catalog.js
          node --check db.js
          node --check sw.js
          node --test worker/browser-auth-permissions.test.mjs
          node --test worker/production-empty-match.test.mjs
          node --test scripts/scoped-roster-client.test.mjs scripts/personal-roster-write-client.test.mjs scripts/roster-staff-role-contract.test.mjs
          node --test scripts/shift-client-auth.test.mjs scripts/pool-save-permission-ui.test.mjs
          node --test scripts/preview-dispatch-lock.test.mjs
      - name: Stamp a unique cache version into this build only
        env:
          NSK_TARGET_VERSION: ${{ github.run_id }}
        run: node scripts/bump-version.cjs
      - name: Verify stamped release consistency
        env:
          NSK_TARGET_VERSION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const version = process.env.NSK_TARGET_VERSION;
          const script = fs.readFileSync('version.js', 'utf8');
          const deploy = JSON.parse(fs.readFileSync('deploy.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const sw = fs.readFileSync('sw.js', 'utf8');
          assert.ok(script.includes('window.NSK_VERSION = "' + version + '";'), 'version.js mismatch');
          assert.equal(deploy.version, version);
          const appVersion = script.match(/NSK_APP_VERSION\s*=\s*"([0-9]+\.[0-9]+(?:\.[0-9]+)?)"/)?.[1];
          assert.ok(appVersion, 'Visible app version missing');
          assert.equal(deploy.appVersion, appVersion);
          assert.equal(manifest.version, appVersion);
          assert.equal(manifest.build, version);
          assert.ok(sw.includes('nsk-team18-v' + version));
          for (const file of ['startsida/index.html', 'ovningsarkiv/index.html', 'truppen/index.html']) {
            assert.ok(fs.readFileSync(file, 'utf8').includes('version.js?v=' + version), file + ' must reference stamped version');
          }
          console.log('Release version consistent:', version);
          NODE
      - name: Assemble only public frontend files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a account-access.js account-users.js concurrency-merge.mjs shell-entry.js app-shell.js private-skills.js view-cache.js equipment.js person-cards.js calendar-match-plan.mjs calendar-list.js index.html app.css app.js navigation.js home-training.js svenskalag-home.js changing-rooms.js training-cards.js shared-training.js admin-mode.js auth.js config.js db.js deploy.json version.js sw.js manifest.webmanifest icon-192.png icon-512.png login-patch.js login-gate.js training-groups.js exercise-archive.js exercise-backup.js rink-drawer.js rink-text-parser.js exercise-rink-preview.js hockeyakademin-catalog.js pool-team-editor.js skate-fields.js qr-code.js sharpening-link-manager.js sharpening-public.js home-icon-black.png print-view.js arena-theme.css roster-view.js _site/
          for dir in skills app aktivera anvandare bytesschema lag laguppstallning login malvaktsstatistik matchvy mittkonto skapapoolspel startsida truppen traningsgrupper ovningsarkiv ritverktyg materialforvaltare slipning; do
            cp -a "$dir" _site/
          done
          touch _site/.nojekyll
          test -s _site/startsida/index.html
          test -s _site/svenskalag-home.js
          test -s _site/version.js
          test -s _site/calendar-match-plan.mjs
          ! test -e _site/worker
          ! test -e _site/wrangler.api.production.toml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link to deployed app
        run: |
          echo "Web app deployed from main commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
