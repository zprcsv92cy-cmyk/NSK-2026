name: Production cutover baseline (read only)
on:
  workflow_dispatch:
    inputs:
      expected_active_version:
        description: 'Current active 100% Worker version ID (rollback baseline)'
        required: true
        type: string
      confirmation:
        description: 'Type READ_ONLY'
        required: true
        type: string
  pull_request:
    paths:
      - 'scripts/production-cutover-readonly-preflight.mjs'
      - '.github/workflows/production-cutover-readonly-preflight.yml'
permissions:
  contents: read
concurrency:
  group: nsk-production-readonly-preflight
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only script syntax
        run: node --check scripts/production-cutover-readonly-preflight.mjs
  live:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'READ_ONLY' }}
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm version and bindings without changing traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACTIVE_VERSION: ${{ inputs.expected_active_version }}
        run: node scripts/production-cutover-readonly-preflight.mjs
