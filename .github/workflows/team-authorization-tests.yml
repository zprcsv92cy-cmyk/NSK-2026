name: Team authorization tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/team-authorization-policy.js'
      - 'worker/team-authorization-policy.test.mjs'
      - '.github/workflows/team-authorization-tests.yml'
  pull_request:
    paths:
      - 'worker/team-authorization-policy.js'
      - 'worker/team-authorization-policy.test.mjs'
      - '.github/workflows/team-authorization-tests.yml'
jobs:
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs
