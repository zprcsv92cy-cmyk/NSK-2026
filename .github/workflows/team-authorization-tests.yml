name: Team authorization tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/team-authorization-policy.js'
      - 'worker/team-authorization-policy.test.mjs'
      - 'worker/production-roster-team-resolver.js'
      - 'worker/production-roster-team-resolver.test.mjs'
      - 'worker/production-roster-integration.test.mjs'
      - 'worker/production-lagpersonal-auth-guard.js'
      - 'worker/production-lagpersonal-auth-guard.test.mjs'
      - 'worker/personal-roster-identity-adapter.js'
      - 'worker/personal-roster-identity-adapter.test.mjs'
      - 'worker/production-roster-route-guard.js'
      - 'worker/production-roster-route-guard.test.mjs'
      - 'worker/staging-roster.js'
      - 'worker/staging-roster.test.mjs'
      - 'worker/staging-roster-route.js'
      - 'worker/staging-roster-route.test.mjs'
      - 'worker/staging-session-identity.js'
      - 'worker/staging-session-identity.test.mjs'
      - 'worker/staging-auth-dispatch.js'
      - 'worker/staging-auth-dispatch.test.mjs'
      - '.github/workflows/team-authorization-tests.yml'
  pull_request:
    paths:
      - 'worker/team-authorization-policy.js'
      - 'worker/team-authorization-policy.test.mjs'
      - 'worker/production-roster-team-resolver.js'
      - 'worker/production-roster-team-resolver.test.mjs'
      - 'worker/production-roster-integration.test.mjs'
      - 'worker/production-lagpersonal-auth-guard.js'
      - 'worker/production-lagpersonal-auth-guard.test.mjs'
      - 'worker/personal-roster-identity-adapter.js'
      - 'worker/personal-roster-identity-adapter.test.mjs'
      - 'worker/production-roster-route-guard.js'
      - 'worker/production-roster-route-guard.test.mjs'
      - 'worker/staging-roster.js'
      - 'worker/staging-roster.test.mjs'
      - 'worker/staging-roster-route.js'
      - 'worker/staging-roster-route.test.mjs'
      - 'worker/staging-session-identity.js'
      - 'worker/staging-session-identity.test.mjs'
      - 'worker/staging-auth-dispatch.js'
      - 'worker/staging-auth-dispatch.test.mjs'
      - '.github/workflows/team-authorization-tests.yml'
jobs:
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/production-roster-route-guard.test.mjs worker/production-roster-team-resolver.test.mjs worker/production-roster-integration.test.mjs worker/production-lagpersonal-auth-guard.test.mjs worker/personal-roster-identity-adapter.test.mjs worker/staging-roster.test.mjs worker/staging-roster-route.test.mjs worker/staging-session-identity.test.mjs worker/staging-auth-dispatch.test.mjs
