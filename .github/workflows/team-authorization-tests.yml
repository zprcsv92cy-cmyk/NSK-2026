      - 'wrangler.auth.production.toml'
      - 'wrangler.api.production.toml'
      - 'scripts/check-api-production-release.mjs'
      - 'scripts/check-api-production-release.test.mjs'
      - 'worker/production-api-v42-reference.js'
      - 'worker/production-api-staff-route.test.mjs'
