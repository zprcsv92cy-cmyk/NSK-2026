jobs:
  security-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser auth and staging code syntax
        run: |
          node --check auth.js
          node scripts/check-staging-imports.mjs
      - name: Confirm login page uses existing auth client without rewriting legacy data
        run: |
          node --input-type=module -e "import {readFileSync as read} from 'node:fs'; import assert from 'node:assert/strict'; const h=read('login/index.html','utf8'); assert.match(h,/Auth\\.login\\(/); assert.match(h,/\.\.\\/auth\\.js/); assert.doesNotMatch(h,/nsk_admin_token|nsk_match_token/); console.log('Login integration verified');"
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated browser production authentication
        run: node scripts/test-production-auth-client.mjs
      - name: Audit historical production Worker source (no deployment)
        run: node scripts/audit-production-worker-snapshot.mjs
      - name: Check trusted legacy team ID mapping
        run: node --test worker/production-team-id-map.test.mjs
      - name: Check production browser preflight for personal API writes
        run: node --experimental-default-type=module --test worker/production-personal-preflight.test.mjs
      - name: Check combined shift save/done serialization
        run: node --experimental-default-type=module --test worker/production-personal-shift-lock-combined.test.mjs
      - name: Check personally authorized multi-team shift saves
        run: node --experimental-default-type=module --test worker/production-personal-shift-save.test.mjs
      - name: Check personally authorized shift completion
        run: node --experimental-default-type=module --test worker/production-personal-shift-done.test.mjs
      - name: Check personally authorized lineup saves
        run: node --experimental-default-type=module --test worker/production-personal-lineup-write.test.mjs
      - name: Check personally authorized match configuration writes
        run: node --experimental-default-type=module --test worker/production-personal-match-write.test.mjs
      - name: Check personally scoped match, lineup and shift reads
        run: node --experimental-default-type=module --test worker/production-personal-match-read.test.mjs
      - name: Check personally scoped poolspel reads
        run: node --experimental-default-type=module --test worker/production-personal-pools.test.mjs
      - name: Check personal team enumeration cannot leak another team
        run: node --experimental-default-type=module --test worker/production-personal-teams.test.mjs
      - name: Check personally authorized lagpersonal writes
        run: node --experimental-default-type=module --test worker/production-personal-staff-mutation.test.mjs
      - name: Check personally authorized roster mutations
        run: node --experimental-default-type=module --test worker/production-personal-roster-mutation.test.mjs
      - name: Verify production login D1 schema
        run: python3 scripts/test-production-login-schema.py
      - name: Dry-run first production administrator activation
        run: node scripts/test-bootstrap-production-admin.mjs
      - name: Check production login throttling
        run: node --experimental-default-type=module --test worker/production-login-guard.test.mjs
      - name: Check allowlisted production authentication endpoints
        run: node --experimental-default-type=module --test worker/production-auth-boundary.test.mjs
      - name: Check composited production Worker entrypoint
        run: node --experimental-default-type=module --test worker/production-entry-candidate.test.mjs
      - name: Check complete personal-auth read-only endpoint
        run: node --test worker/production-personal-roster-endpoint.test.mjs
      - name: Check server-scoped roster data output
        run: node --test worker/production-roster-scoped-data.test.mjs
      - name: Check personal identity-to-roster integration
        run: node --test worker/production-roster-read-integration.test.mjs
      - name: Check production read boundary
        run: node --test worker/production-roster-read-guard.test.mjs
      - run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/production-roster-route-guard.test.mjs worker/production-roster-team-resolver.test.mjs worker/production-roster-integration.test.mjs worker/production-lagpersonal-auth-guard.test.mjs worker/personal-roster-identity-adapter.test.mjs worker/personal-roster-worker-adapter.test.mjs worker/personal-roster-worker-http.test.mjs worker/lagpersonal-kv-ownership.test.mjs worker/staging-roster.test.mjs worker/staging-roster-route.test.mjs worker/staging-session-identity.test.mjs worker/staging-auth-dispatch.test.mjs
