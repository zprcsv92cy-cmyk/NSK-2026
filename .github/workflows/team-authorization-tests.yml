      - 'docs/first-production-administrator.md'
      - 'docs/api-production-rollback-baseline.md'
      - 'worker/team-authorization-policy.js'
      - 'worker/team-authorization-policy.test.mjs'
      - 'worker/shift-write-authorization.js'
      - 'worker/shift-write-authorization.test.mjs'
      - 'worker/production-shift-route-guard.js'
      - 'worker/production-shift-route-guard.test.mjs'
      - 'worker/production-api-v42-reference.js'
      - 'worker/production-roster-team-resolver.js'
      - 'worker/production-roster-team-resolver.test.mjs'
      - 'worker/production-roster-integration.test.mjs'
      - 'worker/production-lagpersonal-write-handler.js'
      - 'worker/production-lagpersonal-write-handler.test.mjs'
      - 'worker/production-lagpersonal-auth-guard.js'
      - 'worker/production-lagpersonal-auth-guard.test.mjs'
      - 'worker/personal-roster-identity-adapter.js'
      - 'worker/personal-roster-identity-adapter.test.mjs'
      - 'worker/personal-roster-worker-adapter.js'
      - 'worker/personal-roster-worker-adapter.test.mjs'
      - 'worker/personal-roster-worker-http.test.mjs'
      - 'worker/lagpersonal-kv-ownership.js'
      - 'worker/lagpersonal-kv-ownership.test.mjs'
      - 'worker/production-roster-route-guard.js'
      - 'worker/production-roster-route-guard.test.mjs'
      - 'worker/staging-roster.js'
      - 'worker/staging-roster.test.mjs'
      - 'worker/staging-roster-route.js'
      - 'worker/staging-roster-route.test.mjs'
      - 'worker/staging-session-identity.js'
      - 'worker/staging-session-identity.test.mjs'
      - 'worker/staging-auth-dispatch.js'
      - 'worker/staging-auth-dispatch.test.mjs'
      - '.github/workflows/auth-production.yml'
      - 'wrangler.auth.production.toml'
      - 'wrangler.api.production.toml'
      - 'scripts/check-api-production-release.mjs'
      - 'scripts/check-api-production-release.test.mjs'
      - 'worker/production-api-v42-reference.js'
      - 'worker/production-api-staff-route.test.mjs'
      - 'worker/production-entry.js'
      - '.github/workflows/team-authorization-tests.yml'
      - 'docs/first-production-administrator.md'
      - 'docs/api-production-rollback-baseline.md'
jobs:
  security-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser auth and staging code syntax
        run: |
          node --check auth.js
          node --check worker/production-api-v42-reference.js
          node --test worker/production-api-staff-route.test.mjs
          node scripts/check-staging-imports.mjs
          node --test scripts/check-api-production-release.test.mjs
      - name: Confirm login page uses existing auth client without rewriting legacy data
        run: |
          node --input-type=module -e "import {readFileSync as read} from 'node:fs'; import assert from 'node:assert/strict'; const h=read('login/index.html','utf8'); assert.match(h,/Auth\\.login\\(/); assert.match(h,/\.\.\\/auth\\.js/); assert.doesNotMatch(h,/nsk_admin_token|nsk_match_token/); console.log('Login integration verified');"
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/production-roster-route-guard.test.mjs worker/production-roster-team-resolver.test.mjs worker/production-roster-integration.test.mjs worker/production-lagpersonal-auth-guard.test.mjs worker/production-lagpersonal-write-handler.test.mjs worker/personal-roster-identity-adapter.test.mjs worker/personal-roster-worker-adapter.test.mjs worker/personal-roster-worker-http.test.mjs worker/lagpersonal-kv-ownership.test.mjs worker/staging-roster.test.mjs worker/staging-roster-route.test.mjs worker/staging-session-identity.test.mjs worker/staging-auth-dispatch.test.mjs
