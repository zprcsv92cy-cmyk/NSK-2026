name: Team authorization tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  security-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser auth and staging code syntax
        run: |
          node --check auth.js
          node --check db.js
          node --test scripts/scoped-roster-client.test.mjs
          node --test scripts/personal-roster-write-client.test.mjs
          node --test scripts/personal-admin-mode-cutover.test.mjs
          node --test scripts/personal-production-cutover-contract.test.mjs
          node --test scripts/personal-pool-team-editor.test.mjs
          node --test scripts/roster-staff-role-contract.test.mjs
          node --test worker/production-coach-selection-authorization.test.mjs worker/production-coach-selection-integration.test.mjs
          node --test scripts/shift-client-auth.test.mjs
          node --test scripts/pool-save-permission-ui.test.mjs
          node --check worker/production-api-v42-reference.js
          node --test worker/production-api-staff-route.test.mjs
          node --experimental-default-type=module --test worker/production-personal-write-route-isolation.test.mjs
          node --experimental-default-type=module --test worker/production-admin-login-cutover.test.mjs
          node --experimental-default-type=module --test worker/production-personal-write-team-matrix.test.mjs
          node --experimental-default-type=module --test worker/production-personal-session-integration.test.mjs
          node scripts/check-staging-imports.mjs
          node --test scripts/check-api-production-release.test.mjs
          node --test scripts/worker-preview-isolation.test.mjs
      - name: Confirm login page uses existing auth client without rewriting legacy data
        run: |
          node --input-type=module -e "import {readFileSync as read} from 'node:fs'; import assert from 'node:assert/strict'; const h=read('login/index.html','utf8'); assert.match(h,/Auth\\.login\\(/); assert.match(h,/\.\.\\/auth\\.js/); assert.doesNotMatch(h,/nsk_admin_token|nsk_match_token/); console.log('Login integration verified');"
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opt-in personal pool write authorization
        run: node --experimental-default-type=module --test worker/production-pool-write-authorization.test.mjs worker/production-pool-write-integration.test.mjs worker/production-match-write-authorization.test.mjs worker/production-match-write-integration.test.mjs
      - run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/shift-write-authorization.test.mjs worker/production-shift-route-guard.test.mjs worker/production-roster-route-guard.test.mjs worker/production-roster-team-resolver.test.mjs worker/production-roster-integration.test.mjs worker/production-lagpersonal-auth-guard.test.mjs worker/production-lagpersonal-write-handler.test.mjs worker/personal-roster-identity-adapter.test.mjs worker/personal-roster-worker-adapter.test.mjs worker/personal-roster-worker-http.test.mjs worker/lagpersonal-kv-ownership.test.mjs worker/staging-roster.test.mjs worker/staging-roster-route.test.mjs worker/staging-session-identity.test.mjs worker/staging-auth-dispatch.test.mjs worker/production-roster-read-guard.test.mjs worker/production-roster-read-integration.test.mjs worker/production-roster-scoped-data.test.mjs worker/production-team-id-map.test.mjs
