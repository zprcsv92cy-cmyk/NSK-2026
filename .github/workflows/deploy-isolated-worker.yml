name: Deploy isolated NSK Worker (never production)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ISOLATED_ONLY to deploy to the isolated Worker
        required: true
        type: string
      positive_calendar_e2e:
        description: After isolated deploy, run synthetic calendar create/read/retry E2E
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nsk-dedicated-isolated-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'ISOLATED_ONLY' && (!inputs.positive_calendar_e2e || github.ref == 'refs/heads/feat/calendar-match-metadata-401') }}
    runs-on: ubuntu-latest
    environment: isolated-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and isolation flags
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const config=readFileSync('wrangler.api.isolated-worker.toml','utf8');
          assert.match(config,/^name = "nsk-api-isolated-preview"$/m);
          assert.match(config,/^BASEROW_DATABASE_ID = "599495"$/m);
          assert.match(config,/^NSK_ISOLATED_MODE = "true"$/m);
          assert.match(config,/^NSK_PREVIEW_ISOLATED = "true"$/m);
          assert.match(config,/^NSK_ENABLE_SHARED_TRAINING = "true"$/m);
          assert.match(config,/^name = "SHIFT_LOCK"$/m);
          assert.doesNotMatch(config,/^BASEROW_DATABASE_ID = "589073"$/m);
          NODE
          node scripts/calendar-isolated-worker-gate.mjs
          node --check worker/production-api-v42-reference.js
          node --test scripts/training-preview-readiness.test.mjs scripts/training-authorized-http.test.mjs scripts/training-payload-regression.test.mjs scripts/training-handler-http.test.mjs scripts/worker-preview-isolation.test.mjs scripts/isolated-preview-baserow-gate.test.mjs
          node scripts/isolated-preview-baserow-gate.mjs
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Build isolated Worker
        run: npx --yes wrangler@4.151.2 deploy --dry-run --config wrangler.api.isolated-worker.toml
      - name: Deploy dedicated isolated Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy --config wrangler.api.isolated-worker.toml

      - name: Identify newly deployed isolated Worker version for positive test
        if: ${{ inputs.positive_calendar_e2e }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "262a0356b18defd22b05df6949c409bf"
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nsk-api-isolated-preview/deployments")"
          version="$(printf '%s' "$response" | jq -er '.result.deployments[0].versions[0].version_id')"
          test -n "$version"
          echo "NSK_E2E_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify calendar import with temporary isolated test identity
        if: ${{ inputs.positive_calendar_e2e }}
        env:
          NSK_E2E_CONFIRMATION: ISOLATED_CALENDAR_E2E
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/calendar-isolated-positive-e2e.mjs
