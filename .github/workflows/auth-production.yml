name: NSK production auth deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsk-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: auth-production
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production entrypoint syntax
        run: node --experimental-default-type=module --check worker/production-entry.js
      - name: Verify account management, activation and password recovery
        run: node --test scripts/account-management.test.mjs scripts/account-access-client.test.mjs
      - name: Run authorization tests
        run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/production-roster-route-guard.test.mjs worker/production-roster-team-resolver.test.mjs worker/production-roster-integration.test.mjs worker/production-lagpersonal-auth-guard.test.mjs
      - name: Build production Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/nsk-production-build --config wrangler.auth.production.toml
      - name: Ensure production global administrator role schema exists
        run: npx --yes wrangler@4 d1 execute nsk-auth-production --remote --file worker/auth-global-admin.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure additive account recovery schema exists
        run: npx --yes wrangler@4 d1 execute nsk-auth-production --remote --file migrations/20261025_account_recovery.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated production auth Worker
        run: npx --yes wrangler@4 deploy --config wrangler.auth.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
