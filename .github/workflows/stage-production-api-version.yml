name: Stage production API version (no traffic)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Full 40-character SHA of the main commit to stage'
        required: true
        type: string
      confirmation:
        description: 'Type UPLOAD_ONLY to upload a Worker version without deploying traffic'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nsk-api-production-version-upload
  cancel-in-progress: false

jobs:
  upload-version:
    runs-on: ubuntu-latest
    # Never accept arbitrary refs or unreviewed branch code as a production candidate.
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'UPLOAD_ONLY' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an exact reviewed main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full SHA required"; exit 1; }
          test "$EXPECTED_SHA" = "$ACTUAL_SHA" || { echo "Main changed since approval"; exit 1; }
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret"; exit 1; }
          # Never log secret contents or the account identifier.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \\
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != 200 ]; then
            echo "::error::Cloudflare API token verification failed (HTTP $status). Replace the GitHub Actions secret CLOUDFLARE_API_TOKEN with a valid Cloudflare API token for the correct account."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release security and integration tests
        run: |
          set -euo pipefail
          node --experimental-default-type=module --test worker/production-pool-write-authorization.test.mjs worker/production-pool-write-integration.test.mjs worker/production-match-write-authorization.test.mjs worker/production-match-write-integration.test.mjs worker/production-coach-selection-authorization.test.mjs worker/production-coach-selection-integration.test.mjs worker/team-authorization-policy.test.mjs
          node --test scripts/personal-roster-write-client.test.mjs scripts/roster-staff-role-contract.test.mjs scripts/pool-save-permission-ui.test.mjs
      - name: Ensure every new write-path switch stays disabled
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const app=readFileSync('config.js','utf8');
          const api=readFileSync('wrangler.api.production.toml','utf8');
          for(const name of ['POOL_WRITES','MATCH_WRITES','COACH_SELECTION']){
            assert.match(app,new RegExp('REQUIRE_PERSONAL_'+name+': false'));
            assert.match(api,new RegExp('NSK_REQUIRE_PERSONAL_'+name+' = "false"'));
          }
          assert.match(app,/REQUIRE_PERSONAL_ROSTER_WRITES: false/);
          NODE
      - name: Confirm remote production bindings have not drifted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/nsk-api/settings',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
          });
          if (response.status===401 || response.status===403) {
            throw Error('Cloudflare rejected the GitHub Actions API token for Worker settings (HTTP '+response.status+'). Check CLOUDFLARE_API_TOKEN permissions, account scope and CLOUDFLARE_ACCOUNT_ID; no upload was attempted.');
          }
          assert.equal(response.status,200,'Unable to read deployed Worker settings (HTTP '+response.status+')');
          const data=await response.json();
          assert.equal(data.success,true,'Cannot verify live bindings');
          const bindings=data.result?.bindings;
          assert.ok(Array.isArray(bindings),'Remote bindings unavailable');
          const expected=[
            ['AUTH_DB','d1','9f937bcb-b0c0-4129-af5b-775cf284dfcb'],
            ['ADMIN_KV','kv_namespace','7f978e9bbcd04b888e5b0dfbc338ba5d'],
            ['NSK_TRAINERS','kv_namespace','f60b048621ea4aca8d67774f5c9db664'],
            ['SHIFT_LOCK','durable_object_namespace','27cd8685c58e4b8aa0aaa85a9d47f6ed']
          ];
          for(const [name,type,id] of expected){
            const b=bindings.find(x=>x.name===name);
            assert.ok(b && b.type===type,'Missing or changed binding: '+name);
            assert.equal(b.database_id || b.namespace_id,id,'Changed binding ID: '+name);
          }
          for(const name of ['ADMIN_PASSWORD','BASEROW_TOKEN','MATCH_PASSWORD']){
            assert.equal(bindings.find(x=>x.name===name)?.type,'secret_text','Missing secret binding: '+name);
          }
          for(const name of ['NSK_REQUIRE_SCOPED_ROSTER_READS','NSK_REQUIRE_SCOPED_TEAM_READS','NSK_REQUIRE_SCOPED_COLLECTION_READS']){
            const b=bindings.find(x=>x.name===name);
            assert.equal(b?.text,'true','Live scoped read security is not enabled: '+name);
          }
          console.log('Live bindings checked without printing any secret values');
          NODE
      - name: Build production API without deploying
        run: npx --yes wrangler@4.151.2 deploy --config wrangler.api.production.toml --dry-run --outdir /tmp/nsk-worker-stage
      - name: Upload immutable version only (no deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.2 versions upload --config wrangler.api.production.toml --message "Staged from GitHub main ${GITHUB_SHA}; NO TRAFFIC"
      - name: Record staged commit
        run: |
          echo "Uploaded production API candidate for commit ${GITHUB_SHA} without traffic deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not run wrangler deploy or versions deploy until live bindings, rollback, and end-to-end authorization are verified." >> "$GITHUB_STEP_SUMMARY"
