name: Kontrollera appversion och byggnummer
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nsk-version-main
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrollera JavaScript
        run: |
          node --check app.js
          node --test worker/browser-auth-permissions.test.mjs
          node --check sw.js
          node --check scripts/bump-version.cjs
      - name: Verifiera konsekvent publicerad version
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const version = fs.readFileSync('version.js','utf8').match(/NSK_VERSION\s*=\s*"([0-9]+)"/)?.[1];
          assert.ok(version, 'version.js saknar versionsnummer');
          assert.equal(String(JSON.parse(fs.readFileSync('deploy.json','utf8')).version), version);
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          const appVersion = fs.readFileSync('version.js','utf8').match(/NSK_APP_VERSION\s*=\s*"([0-9]+\.[0-9]+(?:\.[0-9]+)?)"/)?.[1];
          assert.ok(appVersion, 'Synlig appversion saknas');
          assert.equal(JSON.parse(fs.readFileSync('deploy.json','utf8')).appVersion, appVersion);
          assert.equal(String(manifest.version), appVersion);
          assert.equal(String(manifest.build), version);
          assert.ok(manifest.start_url.includes('v=' + version));
          const sw = fs.readFileSync('sw.js','utf8');
          const cacheVersion = sw.match(/nsk-team18-v(\d+)/)?.[1];
          assert.equal(cacheVersion, version, 'service worker cacheversion skiljer sig från appversionen');
          const assetVersions = [...sw.matchAll(/[?&]v=(\d+)/g)].map(match => match[1]);
          assert.ok(assetVersions.length > 0, 'service worker saknar versionsmärkta resurser');
          assert.ok(assetVersions.every(value => value === version), 'service worker innehåller olika versionsnummer');
          console.log('Versionsfiler och service worker matchar:', version);
          NODE
      - name: Testa versionshöjning utan publicering
        run: |
          node scripts/bump-version.cjs
          node -e "const fs=require('fs'); const v=require('./deploy.json').version; if(!fs.readFileSync('version.js','utf8').includes(v)) process.exit(1); console.log('Versionstest OK:',v)"
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrollera intern byggstämpling
        run: node scripts/bump-version.cjs
      - name: Bekräfta att synlig version är oförändrad
        run: |
          node --test scripts/app-release-version.test.mjs
          echo "Endast byggnummer stämplas automatiskt. Synlig appversion ändras manuellt vid större uppdateringar."
