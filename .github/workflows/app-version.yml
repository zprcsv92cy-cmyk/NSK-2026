name: Automatisk appversion
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nsk-version-main
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrollera JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/bump-version.cjs
      - name: Testa versionshöjning utan publicering
        run: |
          node scripts/bump-version.cjs
          node -e "const fs=require('fs'); const v=require('./deploy.json').version; if(!fs.readFileSync('version.js','utf8').includes(v)) process.exit(1); console.log('Versionstest OK:',v)"
  version:
    if: "github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Uppdatera versionsnummer
        run: node scripts/bump-version.cjs
      - name: Skapa versions-PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/auto-version-bump
          delete-branch: true
          title: "chore: bump app version"
          commit-message: "chore: bump app version [skip ci]"
          body: "Automatisk versionshöjning skapad via pull request för att följa branch protection på main."
          add-paths: |
            version.js
            manifest.webmanifest
            deploy.json
            sw.js
            *.html
