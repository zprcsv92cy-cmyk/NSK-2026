name: Build production Worker bundle

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/production-worker-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bundle all Worker modules
        run: |
          node --test worker/production-empty-match.test.mjs
          npx --yes esbuild@0.25.12 worker/production-api-v42-reference.js --bundle --format=esm --platform=browser --target=es2022 --outfile=dist/nsk-api-worker.mjs
          node --check dist/nsk-api-worker.mjs
          test -s dist/nsk-api-worker.mjs
          grep -q 'AUTH_DB' dist/nsk-api-worker.mjs
      - name: Reject unauthenticated production shift writes
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/nsk-api-worker.mjs';
          const env = { AUTH_DB: {}, BASEROW_TOKEN: 'placeholder', SHIFT_LOCK: {} };
          for (const [method, path, body] of [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1 }],
            ['PATCH', '/api/bytesschema/1/done', { done: true }]
          ]) {
            const request = new Request('https://nsk-api.example' + path, {
              method, headers: { 'Content-Type': 'application/json', Origin: 'https://zprcsv92cy-cmyk.github.io' }, body: JSON.stringify(body)
            });
            const response = await worker.fetch(request, env, {});
            if (response.status !== 401) throw new Error(method + ' ' + path + ' returned ' + response.status + ', expected 401');
          }
          // A forged bearer token must never grant shift-write access.
          // No external network or production database is used in this test.
          for (const [method, path, body] of [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1 }],
            ['PATCH', '/api/bytesschema/1/done', { done: true }]
          ]) {
            const request = new Request('https://nsk-api.example' + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                Origin: 'https://zprcsv92cy-cmyk.github.io',
                Authorization: 'Bearer forged-session-token'
              },
              body: JSON.stringify(body)
            });
            const response = await worker.fetch(request, env, {});
            if (response.status !== 401) throw new Error('Forged token accepted for ' + method + ' ' + path + ': ' + response.status);
          }
          NODE
      - name: Reject malformed and client-forged shift writes
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/nsk-api-worker.mjs';
          const env = { AUTH_DB: {}, BASEROW_TOKEN: 'placeholder', SHIFT_LOCK: {} };
          const cases = [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1, team_id: 'NSK Team 18' }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1, teamId: 'NSK Team 18' }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 0, match_no: 1 }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: -1 }, 400],
            ['PATCH', '/api/bytesschema/1/done', { done: 'true' }, 400],
            ['PATCH', '/api/bytesschema/1/done', { done: 1 }, 400]
          ];
          for (const [method, path, body, expected] of cases) {
            const response = await worker.fetch(new Request('https://nsk-api.example' + path, {
              method,
              headers: { 'Content-Type': 'application/json', Origin: 'https://zprcsv92cy-cmyk.github.io' },
              body: JSON.stringify(body)
            }), env, {});
            if (response.status !== expected) {
              throw new Error(method + ' ' + path + ' with ' + JSON.stringify(body) +
                ': expected ' + expected + ', got ' + response.status);
            }
          }
          NODE
      - name: Verify real shift routes with isolated session, Baserow and lock fakes
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/nsk-api-worker.mjs';
          const token = 'a'.repeat(32);
          let lockCalls = [];
          let requests = [];
          const rows = {
            '1255101/12': { id: 12, Lag: [{ id: 91 }], 'Antal lag': 2 },
            '1255083/91': { id: 91, Namn: 'NSK Team 18' },
            '1255115/31': { id: 31, Poolspel: [{ id: 12 }], Lagnummer: 1, Matchnummer: 1 }
          };
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (url, opts) => {
            requests.push(String(url));
            if (opts?.headers?.Authorization !== 'Token fake-baserow') throw Error('Unexpected Baserow token');
            const match = String(url).match(/table\/(\d+)\/(\d+)\//);
            if (!match) throw Error('Unexpected network request: ' + url);
            const row = rows[match[1] + '/' + match[2]];
            return Response.json(row || {}, { status: row ? 200 : 404 });
          };
          const env = {
            BASEROW_TOKEN: 'fake-baserow',
            AUTH_DB: { prepare(sql) { return { bind() { return {
              first: async () => ({ id: 'u-shift', display_name: 'Tester', is_global_admin: 0 }),
              all: async () => ({ results: sql.includes('auth_team_memberships')
                ? [{ team_id: 'NSK Team 18', role: 'team_admin' }]
                : [{ permission: 'shifts:check' }] })
            }; } }; } },
            SHIFT_LOCK: {
              idFromName: key => key,
              get: key => ({ fetch: async (url, init) => {
                lockCalls.push({ key, body: JSON.parse(init.body) });
                return Response.json({ ok: true });
              } })
            }
          };
          async function call(method, path, body, authorized = true, hasGrant = true) {
            const response = await worker.fetch(new Request('https://nsk-api.example' + path, {
              method, headers: { 'Content-Type': 'application/json',
                Origin: 'https://zprcsv92cy-cmyk.github.io',
                Authorization: 'Bearer ' + token },
              body: JSON.stringify(body)
            }), { ...env, AUTH_DB: {
              prepare(sql) { return { bind() { return {
                first: async () => ({ id: 'u-shift', display_name: 'Tester', is_global_admin: 0 }),
                all: async () => ({ results: sql.includes('auth_team_memberships')
                  ? [{ team_id: authorized ? 'NSK Team 18' : 'NSK Testlag 2', role: 'team_admin' }]
                  : hasGrant ? [{ permission: 'shifts:check' }] : [] })
              }; } }; }
            } }, {});
            return response.status;
          }
          try {
            const save = { pool_id: 12, lag_no: 1, match_no: 1, shifts: [] };
            if (await call('POST', '/api/bytesschema/save', save) !== 200) throw Error('Authorized save rejected');
            if (lockCalls.length !== 1 || lockCalls[0].key !== '12:1:1' || lockCalls[0].body.action !== 'save')
              throw Error('Authorized save not forwarded to expected lock');
            if (await call('POST', '/api/bytesschema/save', save, false) !== 403) throw Error('Cross-team save accepted');
            if (lockCalls.length !== 1) throw Error('Unauthorized save reached lock');
            if (await call('PATCH', '/api/bytesschema/31/done', { done: true }) !== 200) throw Error('Authorized done rejected');
            if (lockCalls.length !== 2 || lockCalls[1].body.action !== 'done' || lockCalls[1].body.id !== 31)
              throw Error('Authorized done not forwarded to lock');
            if (await call('PATCH', '/api/bytesschema/31/done', { done: false }, false) !== 403)
              throw Error('Cross-team done accepted');
            if (lockCalls.length !== 2) throw Error('Unauthorized done reached lock');
            if (await call('POST', '/api/bytesschema/save', save, true, false) !== 403)
              throw Error('Save without personal grant accepted');
            if (await call('PATCH', '/api/bytesschema/31/done', { done: true }, true, false) !== 403)
              throw Error('Done without personal grant accepted');
            if (lockCalls.length !== 2) throw Error('Missing grant reached lock');
            delete rows['1255101/12'];
            if (await call('POST', '/api/bytesschema/save', save) !== 503)
              throw Error('Missing trusted pool did not fail closed');
            if (lockCalls.length !== 2) throw Error('Missing trusted pool reached lock');
            if (requests.some(url => !url.startsWith('https://api.baserow.io/api/database/rows/table/')))
              throw Error('Unexpected external request');
          } finally { globalThis.fetch = originalFetch; }
          NODE
      - name: Exercise actual ShiftLock save and done with isolated Baserow
        run: |
          node --input-type=module <<'NODE'
          import { ShiftLock } from './dist/nsk-api-worker.mjs';
          const originalFetch = globalThis.fetch;
          const base = 'https://api.baserow.io/api/database/rows/table/';
          const rows = {
            '1255101/12': { id: 12, Lag: [{ id: 92 }], 'Antal lag': 1, 'Antal matcher': 1, Perioder: 2 },
            '1255083/92': { id: 92, Namn: 'NSK Testlag 2' },
            '1255115/31': { id: 31, Poolspel: [{ id: 12 }], Lagnummer: 1, Matchnummer: 1, 'Genomfört': false }
          };
          let writes = [];
          globalThis.fetch = async (url, init = {}) => {
            if (!String(url).startsWith(base)) throw Error('External network blocked: ' + url);
            if (init.headers?.Authorization !== 'Token fake-baserow') throw Error('Unexpected token');
            const path = String(url).slice(base.length).split('?')[0].replace(/\/$/, '');
            const method = init.method || 'GET';
            if (method === 'PATCH' && path === '1255115/31') {
              writes.push(JSON.parse(init.body));
              Object.assign(rows[path], JSON.parse(init.body));
              return Response.json(rows[path]);
            }
            if (method !== 'GET') throw Error('Unexpected write: ' + method + ' ' + path);
            if (path === '1255083') return Response.json({ results: [{ id: 92, Namn: 'NSK Testlag 2', 'Säsong': '2026' }] });
            if (path === '1255098') return Response.json({ results: [], next: null });
            if (path === '1255115') return Response.json({ results: [], next: null });
            const row = rows[path];
            return Response.json(row || {}, { status: row ? 200 : 404 });
          };
          try {
            const lock = new ShiftLock({}, { BASEROW_TOKEN: 'fake-baserow' });
            const result = await lock.fetch(new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'done', id: 31, pool_id: 12, lag_no: 1, match_no: 1, done: true })
            }));
            if (result.status !== 200 || writes.length !== 1 || writes[0]['Genomfört'] !== true)
              throw Error('ShiftLock.done failed for non-Team-18 pool: ' + result.status);
            const again = await lock.fetch(new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'done', id: 31, pool_id: 12, lag_no: 1, match_no: 1, done: true })
            }));
            if (again.status !== 200 || writes.length !== 1)
              throw Error('ShiftLock.done is not idempotent');
            const save = await lock.fetch(new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'save', pool_id: 12, lag_no: 1, match_no: 1, shifts: [] })
            }));
            if (save.status !== 200) throw Error('ShiftLock.save failed for non-Team-18 pool: ' + save.status);
            // Concurrent requests to the same Durable Object must not overlap.
            let active = 0, peak = 0;
            globalThis.fetch = async (url, init = {}) => {
              if (!String(url).startsWith(base)) throw Error('External network blocked');
              if (init.headers?.Authorization !== 'Token fake-baserow') throw Error('Unexpected token');
              const path = String(url).slice(base.length).split('?')[0].replace(/\/$/, '');
              if (init.method === 'PATCH' && path === '1255115/31') {
                active++; peak = Math.max(peak, active);
                await new Promise(resolve => setTimeout(resolve, 20));
                Object.assign(rows[path], JSON.parse(init.body));
                active--;
                return Response.json(rows[path]);
              }
              if (path === '1255101/12' || path === '1255083/92' || path === '1255115/31')
                return Response.json(rows[path]);
              throw Error('Unexpected Baserow operation: ' + path);
            };
            const makeDone = done => new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'done', id: 31, pool_id: 12, lag_no: 1, match_no: 1, done })
            });
            const [first, second] = await Promise.all([
              lock.fetch(makeDone(false)), lock.fetch(makeDone(true))
            ]);
            if (first.status !== 200 || second.status !== 200 || peak !== 1 ||
                rows['1255115/31']['Genomfört'] !== true)
              throw Error('Concurrent done requests were not serialized correctly');
          } finally { globalThis.fetch = originalFetch; }
          NODE
      - name: Persist and verify a full ShiftLock schedule with isolated Baserow
        run: |
          node --input-type=module <<'NODE'
          import { ShiftLock } from './dist/nsk-api-worker.mjs';
          const originalFetch = globalThis.fetch;
          const base = 'https://api.baserow.io/api/database/rows/table/';
          const pool = { id: 12, Lag: [{ id: 92 }], 'Antal lag': 1, 'Antal matcher': 1, Perioder: 2 };
          const team = { id: 92, Namn: 'NSK Testlag 2' };
          const player = { id: 101, Lag: [{ id: 92 }] };
          const saved = [];
          let posts = 0;
          globalThis.fetch = async (url, init = {}) => {
            if (!String(url).startsWith(base) || init.headers?.Authorization !== 'Token fake-baserow')
              throw Error('Unexpected external request');
            const path = String(url).slice(base.length).split('?')[0].replace(/\/$/, '');
            if (init.method === 'POST' && path === '1255115') {
              posts++;
              const row = { id: 200 + posts, ...JSON.parse(init.body) };
              saved.push(row);
              return Response.json(row);
            }
            if (init.method && init.method !== 'GET') throw Error('Unexpected mutation');
            if (path === '1255101/12') return Response.json(pool);
            if (path === '1255083/92') return Response.json(team);
            if (path === '1255098') return Response.json({ results: [player], next: null });
            if (path === '1255115') return Response.json({ results: saved, next: null });
            throw Error('Unexpected Baserow read: ' + path);
          };
          try {
            const lock = new ShiftLock({}, { BASEROW_TOKEN: 'fake-baserow' });
            const body = { action: 'save', pool_id: 12, lag_no: 1, match_no: 1,
              shifts: [{ period_no: 1, time_left: '10:00', players: [101] }] };
            const request = () => new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            const first = await lock.fetch(request());
            const firstData = await first.json();
            if (first.status !== 200 || firstData.cleanup_pending !== true || posts !== 1)
              throw Error('First save did not persist expected Baserow row');
            const second = await lock.fetch(request());
            const secondData = await second.json();
            if (second.status !== 200 || secondData.verified !== true || secondData.count !== 1 || posts !== 1)
              throw Error('Repeated save did not verify persisted row without duplication');
            if (saved[0].Lagnummer !== 1 || saved[0].Matchnummer !== 1 ||
                saved[0].Bytenummer !== 1 || saved[0]['Genomfört'] !== false)
              throw Error('Persisted shift row has wrong fields');
          } finally { globalThis.fetch = originalFetch; }
          NODE
      - name: Verify repeated shift save and completed-shift protection
        run: |
          node --input-type=module <<'NODE'
          import { ShiftLock } from './dist/nsk-api-worker.mjs';
          const originalFetch = globalThis.fetch;
          const base = 'https://api.baserow.io/api/database/rows/table/';
          const pool = { id: 12, Lag: [{ id: 92 }], 'Antal lag': 1, 'Antal matcher': 1, Perioder: 2 };
          const shiftRows = [];
          const writes = [];
          globalThis.fetch = async (url, init = {}) => {
            if (!String(url).startsWith(base) || init.headers?.Authorization !== 'Token fake-baserow')
              throw Error('Unexpected external request');
            const path = String(url).slice(base.length).split('?')[0].replace(/\/$/, '');
            const method = init.method || 'GET';
            if (path === '1255101/12' && method === 'GET') return Response.json(pool);
            if (path === '1255083/92' && method === 'GET') return Response.json({ id: 92, Namn: 'NSK Testlag 2' });
            if (path === '1255098' && method === 'GET')
              return Response.json({ results: [{ id: 51, Lag: [{ id: 92 }] }], next: null });
            if (path === '1255115' && method === 'GET')
              return Response.json({ results: shiftRows, next: null });
            if (path === '1255115' && method === 'POST') {
              const body = JSON.parse(init.body);
              writes.push(body);
              const row = { id: 31, ...body };
              shiftRows.push(row);
              return Response.json(row);
            }
            throw Error('Unexpected operation: ' + method + ' ' + path);
          };
          try {
            const lock = new ShiftLock({}, { BASEROW_TOKEN: 'fake-baserow' });
            const body = { action: 'save', pool_id: 12, lag_no: 1, match_no: 1,
              shifts: [{ period_no: 1, time_left: '09:00', players: [51] }] };
            const call = async data => lock.fetch(new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
            }));
            const first = await call(body);
            if (first.status !== 200 || writes.length !== 1 ||
                writes[0].Bytenummer !== 1 || writes[0]['Spelare på plan'][0] !== 51)
              throw Error('First save did not persist expected shift');
            const second = await call(body);
            if (second.status !== 200 || (await second.json()).verified !== true || writes.length !== 1)
              throw Error('Repeated save did not verify persisted shift');
            shiftRows[0]['Genomfört'] = true;
            const changed = await call({ ...body, shifts: [{ ...body.shifts[0], time_left: '08:30' }] });
            if (changed.status !== 409 || writes.length !== 1)
              throw Error('Completed shift was changed or not protected');
          } finally { globalThis.fetch = originalFetch; }
          NODE
      - name: Verify full ShiftLock save persistence and completed-shift protection
        run: |
          node --input-type=module <<'NODE'
          import { ShiftLock } from './dist/nsk-api-worker.mjs';
          const originalFetch = globalThis.fetch;
          const base = 'https://api.baserow.io/api/database/rows/table/';
          const pool = { id: 12, Lag: [{ id: 92 }], 'Antal lag': 1, 'Antal matcher': 1, Perioder: 2 };
          const shiftRows = [];
          const writes = [];
          globalThis.fetch = async (url, init = {}) => {
            if (!String(url).startsWith(base) || init.headers?.Authorization !== 'Token fake-baserow')
              throw Error('Unexpected external request');
            const path = String(url).slice(base.length).split('?')[0].replace(/\/$/, '');
            const method = init.method || 'GET';
            if (path === '1255101/12' && method === 'GET') return Response.json(pool);
            if (path === '1255083/92' && method === 'GET') return Response.json({ id: 92, Namn: 'NSK Testlag 2' });
            if (path === '1255098' && method === 'GET')
              return Response.json({ results: [{ id: 51, Lag: [{ id: 92 }] }], next: null });
            if (path === '1255115' && method === 'GET')
              return Response.json({ results: shiftRows, next: null });
            if (path === '1255115' && method === 'POST') {
              const body = JSON.parse(init.body);
              writes.push(body);
              const row = { id: 31, ...body };
              shiftRows.push(row);
              return Response.json(row);
            }
            throw Error('Unexpected operation: ' + method + ' ' + path);
          };
          try {
            const lock = new ShiftLock({}, { BASEROW_TOKEN: 'fake-baserow' });
            const body = { action: 'save', pool_id: 12, lag_no: 1, match_no: 1,
              shifts: [{ period_no: 1, time_left: '09:00', players: [51] }] };
            const call = async data => lock.fetch(new Request('https://shift-lock.internal/', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
            }));
            const first = await call(body);
            if (first.status !== 200 || writes.length !== 1 ||
                writes[0].Bytenummer !== 1 || writes[0]['Spelare på plan'][0] !== 51)
              throw Error('First save did not persist expected shift');
            const second = await call(body);
            if (second.status !== 200 || (await second.json()).verified !== true || writes.length !== 1)
              throw Error('Repeated save did not verify persisted shift');
            shiftRows[0]['Genomfört'] = true;
            const changed = await call({ ...body, shifts: [{ ...body.shifts[0], time_left: '08:30' }] });
            if (changed.status !== 409 || writes.length !== 1)
              throw Error('Completed shift was changed or not protected');
          } finally { globalThis.fetch = originalFetch; }
          NODE
      - name: Upload candidate to Cloudflare (manual only, no deployment)
        id: upload
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          cat > dist/metadata.json <<'JSON'
          {"main_module":"nsk-api-worker.mjs","compatibility_date":"2026-10-10","exports":{"ShiftLock":{"type":"durable-object","storage":"sqlite"}},"bindings":[{"name":"ADMIN_KV","type":"inherit"},{"name":"ADMIN_PASSWORD","type":"inherit"},{"name":"AUTH_DB","type":"inherit"},{"name":"BASEROW_DATABASE_ID","type":"inherit"},{"name":"BASEROW_TOKEN","type":"inherit"},{"name":"MATCH_PASSWORD","type":"inherit"},{"name":"NSK_DISABLE_LEGACY_AUTH","type":"inherit"},{"name":"NSK_ENABLE_SHARED_TRAINING","type":"inherit"},{"name":"NSK_ENABLE_SVENSKALAG_AUTO_SYNC","type":"inherit"},{"name":"NSK_REQUIRE_PERSONAL_COACH_SELECTION","type":"inherit"},{"name":"NSK_REQUIRE_PERSONAL_MATCH_WRITES","type":"inherit"},{"name":"NSK_REQUIRE_PERSONAL_POOL_WRITES","type":"inherit"},{"name":"NSK_REQUIRE_SCOPED_COLLECTION_READS","type":"inherit"},{"name":"NSK_REQUIRE_SCOPED_ROSTER_READS","type":"inherit"},{"name":"NSK_REQUIRE_SCOPED_TEAM_READS","type":"inherit"},{"name":"NSK_SVENSKALAG_TEAM_ID","type":"inherit"},{"name":"NSK_TRAINERS","type":"inherit"},{"name":"SHIFT_LOCK","type":"inherit"}]}
          JSON
          curl --fail-with-body --silent --show-error --request POST             --header "Authorization: Bearer $CF_API_TOKEN"             --form 'metadata=<dist/metadata.json;type=application/json'             --form 'nsk-api-worker.mjs=@dist/nsk-api-worker.mjs;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/nsk-api/versions?bindings_inherit=strict"             | python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d.get("success"), d.get("errors"); v=(d.get("result") or {}).get("id"); assert v, "Missing uploaded version ID"; print("Uploaded candidate version:",v); open(os.environ["GITHUB_OUTPUT"],"a").write("version_id="+v+"\n")'
      # nsk-api implements the ShiftLock Durable Object. Cloudflare does not
      # generate Version URLs for Workers that implement Durable Objects.
      # Do not require metadata.has_preview here; test candidate in a
      # separate isolated Worker with dedicated test resources instead.
      - name: Store bundle for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: nsk-api-worker-candidate
          path: dist/nsk-api-worker.mjs
          retention-days: 7
