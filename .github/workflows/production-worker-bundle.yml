name: Build production Worker bundle

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/production-worker-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bundle all Worker modules
        run: |
          npx --yes esbuild@0.25.12 worker/production-api-v42-reference.js --bundle --format=esm --platform=browser --target=es2022 --outfile=dist/nsk-api-worker.mjs
          node --check dist/nsk-api-worker.mjs
          test -s dist/nsk-api-worker.mjs
          grep -q 'AUTH_DB' dist/nsk-api-worker.mjs
      - name: Reject unauthenticated production shift writes
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/nsk-api-worker.mjs';
          const env = { AUTH_DB: {}, BASEROW_TOKEN: 'placeholder', SHIFT_LOCK: {} };
          for (const [method, path, body] of [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1 }],
            ['PATCH', '/api/bytesschema/1/done', { done: true }]
          ]) {
            const request = new Request('https://nsk-api.example' + path, {
              method, headers: { 'Content-Type': 'application/json', Origin: 'https://zprcsv92cy-cmyk.github.io' }, body: JSON.stringify(body)
            });
            const response = await worker.fetch(request, env, {});
            if (response.status !== 401) throw new Error(method + ' ' + path + ' returned ' + response.status + ', expected 401');
          }
          // A forged bearer token must never grant shift-write access.
          // No external network or production database is used in this test.
          for (const [method, path, body] of [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1 }],
            ['PATCH', '/api/bytesschema/1/done', { done: true }]
          ]) {
            const request = new Request('https://nsk-api.example' + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                Origin: 'https://zprcsv92cy-cmyk.github.io',
                Authorization: 'Bearer forged-session-token'
              },
              body: JSON.stringify(body)
            });
            const response = await worker.fetch(request, env, {});
            if (response.status !== 401) throw new Error('Forged token accepted for ' + method + ' ' + path + ': ' + response.status);
          }
          NODE
      - name: Reject malformed and client-forged shift writes
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/nsk-api-worker.mjs';
          const env = { AUTH_DB: {}, BASEROW_TOKEN: 'placeholder', SHIFT_LOCK: {} };
          const cases = [
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1, team_id: 'NSK Team 18' }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: 1, teamId: 'NSK Team 18' }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 0, match_no: 1 }, 400],
            ['POST', '/api/bytesschema/save', { pool_id: 1, lag_no: 1, match_no: -1 }, 400],
            ['PATCH', '/api/bytesschema/1/done', { done: 'true' }, 400],
            ['PATCH', '/api/bytesschema/1/done', { done: 1 }, 400]
          ];
          for (const [method, path, body, expected] of cases) {
            const response = await worker.fetch(new Request('https://nsk-api.example' + path, {
              method,
              headers: { 'Content-Type': 'application/json', Origin: 'https://zprcsv92cy-cmyk.github.io' },
              body: JSON.stringify(body)
            }), env, {});
            if (response.status !== expected) {
              throw new Error(method + ' ' + path + ' with ' + JSON.stringify(body) +
                ': expected ' + expected + ', got ' + response.status);
            }
          }
          NODE
      - name: Upload candidate to Cloudflare (manual only, no deployment)
        id: upload
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          cat > dist/metadata.json <<'JSON'
          {"main_module":"nsk-api-worker.mjs","bindings":[{"name":"ADMIN_KV","type":"inherit"},{"name":"ADMIN_PASSWORD","type":"inherit"},{"name":"AUTH_DB","type":"inherit"},{"name":"BASEROW_DATABASE_ID","type":"inherit"},{"name":"BASEROW_TOKEN","type":"inherit"},{"name":"MATCH_PASSWORD","type":"inherit"},{"name":"NSK_TRAINERS","type":"inherit"},{"name":"SHIFT_LOCK","type":"inherit"}]}
          JSON
          curl --fail-with-body --silent --show-error --request POST             --header "Authorization: Bearer $CF_API_TOKEN"             --form 'metadata=<dist/metadata.json;type=application/json'             --form 'nsk-api-worker.mjs=@dist/nsk-api-worker.mjs;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/nsk-api/versions?bindings_inherit=strict"             | python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d.get("success"), d.get("errors"); v=(d.get("result") or {}).get("id"); assert v, "Missing uploaded version ID"; print("Uploaded candidate version:",v); open(os.environ["GITHUB_OUTPUT"],"a").write("version_id="+v+"\n")'
      # nsk-api implements the ShiftLock Durable Object. Cloudflare does not
      # generate Version URLs for Workers that implement Durable Objects.
      # Do not require metadata.has_preview here; test candidate in a
      # separate isolated Worker with dedicated test resources instead.
      - name: Store bundle for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: nsk-api-worker-candidate
          path: dist/nsk-api-worker.mjs
          retention-days: 7
