name: Isolated personal-permissions release preview
on:
  push:
    branches: [release/personal-permissions-production-20261020]
    paths:
      - 'worker/**'
      - 'wrangler.api.preview.toml'
      - 'scripts/smoke-isolated-api-preview.mjs'
      - '.github/workflows/release-personal-preview.yml'
permissions:
  contents: read
concurrency:
  group: nsk-personal-release-preview
  cancel-in-progress: false
jobs:
  release-preview:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'zprcsv92cy-cmyk/NSK-2026' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and isolated Preview bindings
        run: |
          node --check worker/production-api-v42-reference.js
          node --test scripts/worker-preview-isolation.test.mjs
          node --test scripts/personal-production-cutover-contract.test.mjs
      - name: Ensure Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Start isolated release candidate Preview without production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.151.2 preview --name nsk-personal-release-20261020 --config wrangler.api.preview.toml --message "Personal release candidate from ${GITHUB_SHA}; isolated, no traffic"
      - name: Smoke candidate API anonymously (no Baserow writes)
        env:
          NSK_PREVIEW_BASE_URL: https://nsk-personal-release-20261020-nsk-api.peter-hasselberg.workers.dev
        run: node scripts/smoke-isolated-api-preview.mjs
