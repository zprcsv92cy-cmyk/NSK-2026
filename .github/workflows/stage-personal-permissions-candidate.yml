name: Stage personal-permissions production candidate (no traffic)
on:
  push:
    branches: [release/personal-permissions-production-20261020]
    paths:
      - 'wrangler.api.production.toml'
      - 'worker/**'
      - 'config.js'
      - 'scripts/personal-production-cutover-contract.test.mjs'
      - 'scripts/production-cutover-readonly-preflight.mjs'
      - '.github/workflows/stage-personal-permissions-candidate.yml'
permissions:
  contents: read
concurrency:
  group: nsk-api-release-upload-only
  cancel-in-progress: false
jobs:
  upload-only:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'zprcsv92cy-cmyk/NSK-2026' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact release switches and security contract
        run: |
          set -euo pipefail
          node --check worker/production-api-v42-reference.js
          node --test scripts/personal-production-cutover-contract.test.mjs
          node --experimental-default-type=module --test worker/production-admin-login-cutover.test.mjs worker/production-personal-write-team-matrix.test.mjs worker/production-personal-write-route-isolation.test.mjs
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read current Worker deployment and bindings, abort on drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACTIVE_VERSION: 7434d756-524c-43c4-95b2-73cc942a256b
        run: node scripts/production-cutover-readonly-preflight.mjs
      - name: Wrangler build without deployment
        run: npx --yes wrangler@4.151.2 deploy --config wrangler.api.production.toml --dry-run --outdir /tmp/nsk-personal-release
      - name: Upload candidate version without deploying traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.151.2 versions upload --config wrangler.api.production.toml --message "PERSONAL CANDIDATE ${GITHUB_SHA}; upload only, no traffic"
      - name: Record release candidate
        run: |
          echo "## Personal permissions release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload only. Production traffic not changed." >> "$GITHUB_STEP_SUMMARY"
