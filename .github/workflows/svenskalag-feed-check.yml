name: SvenskaLag live feed read-only check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worker/svenskalag-ical.js'
      - 'scripts/check-svenskalag-feed.mjs'
      - '.github/workflows/svenskalag-feed-check.yml'
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source calendar without saving entries
        run: node scripts/check-svenskalag-feed.mjs
