name: Calendar match planning tests

on:
  pull_request:
    paths:
      - 'calendar-match-plan.mjs'
      - 'app.js'
      - 'scripts/calendar-match-plan.test.mjs'
      - 'scripts/calendar-match-baserow-fields.test.mjs'
      - 'scripts/calendar-match-concurrency.test.mjs'
      - 'scripts/calendar-pool-idempotency.test.mjs'
      - 'db.js'
      - 'worker/production-api-v42-reference.js'
      - '.github/workflows/calendar-match-plan-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-match-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app syntax
        run: node --check app.js
      - name: Verify calendar mapping and Baserow fields
        run: node --test scripts/calendar-match-plan.test.mjs scripts/calendar-match-baserow-fields.test.mjs scripts/calendar-match-concurrency.test.mjs scripts/calendar-pool-idempotency.test.mjs
