name: Production Worker candidate build (no deployment)
on:
  pull_request:
    paths:
      - 'worker/production-*.js'
      - 'worker/production-*.mjs'
      - 'reference/legacy-nsk-api-worker-v42.snapshot.js'
      - 'worker/staging-session-identity.js'
      - 'wrangler.production.candidate.toml'
      - 'config.js'
      - 'db.js'
      - 'scripts/check-production-rollout-gate.mjs'
      - '.github/workflows/production-candidate-build.yml'
permissions:
  contents: read
jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce explicit production rollout safety gate
        run: node scripts/check-production-rollout-gate.mjs
      - name: Check candidate is not configured with staging auth DB
        run: |
          node -e "const f=require('fs').readFileSync('wrangler.production.candidate.toml','utf8'); if(/b5a439d1-9e94-42eb-a8c4-5d3a0e7416f8|nsk-auth-staging|nsk-auth-staging\.peter-hasselberg\.workers\.dev/.test(f.replace(/^#.*$/gm,'')))process.exit(1);"
      - name: Bundle composed production Worker (dry-run only)
        run: npx --yes wrangler@4 deploy --config wrangler.production.candidate.toml --dry-run --outdir /tmp/nsk-production-candidate
