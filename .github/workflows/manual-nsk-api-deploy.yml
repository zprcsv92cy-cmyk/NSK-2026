name: Manual NSK API production deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-NSK-API to authorize production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nsk-api-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-NSK-API' }}
    runs-on: ubuntu-latest
    environment: nsk-api-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare credentials and required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Verify production Worker bundle
        run: |
          npx --yes wrangler@4 deploy --config wrangler.api.production.toml --dry-run --outdir /tmp/nsk-api-dry-run
          test -n "$(find /tmp/nsk-api-dry-run -type f -name '*.js' -print -quit)"
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.api.production.toml
