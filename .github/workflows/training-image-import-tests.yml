name: Training image import tests
on:
  pull_request:
    paths:
      - 'training-groups.js'
      - 'traningsgrupper/**'
      - 'scripts/training-image-import.test.cjs'
      - '.github/workflows/training-image-import-tests.yml'
  push:
    branches:
      - feature/training-attendance-image-import-20261022
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check training-groups.js
      - name: Run attendance import and frontend regression tests
        run: node --test scripts/training-image-import.test.cjs scripts/frontend-regression-guard.test.cjs
