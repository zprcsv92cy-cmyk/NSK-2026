name: Full app regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every local unit and integration test
        run: node --test scripts/*.test.mjs scripts/*.test.cjs worker/*.test.mjs
      - name: Verify local training database integration
        run: python3 scripts/training-d1-integration.test.py
      - name: Install isolated training DOM dependency
        run: npm install --prefix "$RUNNER_TEMP/training-dom" jsdom@26 --no-audit --no-fund
      - name: Verify training settings through real page, HTTP client and isolated database
        run: NSK_JSDOM_MODULE="$RUNNER_TEMP/training-dom/node_modules/jsdom/lib/api.js" node scripts/training-settings-dom-check.mjs
      - name: Verify per-match lineup edit, save, reload and failure recovery
        run: NSK_JSDOM_MODULE="$RUNNER_TEMP/training-dom/node_modules/jsdom/lib/api.js" node scripts/lineup-editor-dom-check.mjs
      - name: Verify shift check and uncheck through UI, client and production lock
        run: NSK_JSDOM_MODULE="$RUNNER_TEMP/training-dom/node_modules/jsdom/lib/api.js" node scripts/shift-uncheck-dom-check.mjs
      - name: Verify calendar grouping and removal during a match API outage
        run: NSK_JSDOM_MODULE="$RUNNER_TEMP/training-dom/node_modules/jsdom/lib/api.js" node scripts/calendar-outage-dom-check.mjs
      - name: Install isolated Workers runtime dependencies
        run: npm install --prefix "$RUNNER_TEMP/read-runtime" esbuild@0.25.12 workerd@1.20261023.1 --no-audit --no-fund
      - name: Verify concurrent authorized reads in real Workers runtime
        run: NSK_RUNTIME_DEPS="$RUNNER_TEMP/read-runtime/node_modules" node scripts/baserow-read-workerd-check.mjs
