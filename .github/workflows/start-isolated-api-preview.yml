name: Start isolated NSK API Preview (no production traffic)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREVIEW_ONLY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nsk-isolated-api-preview
  cancel-in-progress: false
jobs:
  preview:
    if: ${{ inputs.confirmation == 'PREVIEW_ONLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated resource configuration
        run: |
          node --test scripts/worker-preview-isolation.test.mjs
          node --check worker/production-api-v42-reference.js
      - name: Require Cloudflare Actions credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
      - name: Create isolated Worker Preview (never production deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.151.2 preview --name nsk-isolated-auth-20261020 --config wrangler.api.preview.toml --message "Isolated preview from main ${GITHUB_SHA}; no production traffic"
      - name: Smoke isolated Preview anonymous reads (GET only)
        run: node scripts/smoke-isolated-api-preview.mjs
      - name: Explain isolation and limitations
        run: |
          {
            echo "## Isolated API Preview"
            echo "Preview created from \`main\` using \`wrangler.api.preview.toml\`."
            echo "No production deployment was requested."
            echo "Uses separate D1 and KV. Durable Object storage is preview-isolated."
            echo "No Baserow credential is provisioned; live business-data write tests are not enabled."
          } >> "$GITHUB_STEP_SUMMARY"
