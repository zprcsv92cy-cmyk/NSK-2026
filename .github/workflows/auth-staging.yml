name: NSK auth staging deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsk-auth-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: auth-staging
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging dependencies before deployment
        run: node scripts/check-staging-imports.mjs
      - name: Run authorization regression tests before deployment
        run: node --experimental-default-type=module --test worker/team-authorization-policy.test.mjs worker/production-roster-route-guard.test.mjs worker/staging-roster.test.mjs worker/staging-roster-route.test.mjs worker/staging-session-identity.test.mjs worker/staging-auth-dispatch.test.mjs
      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@4 deploy --config wrangler.auth.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check unauthorized requests
        run: node scripts/test-auth-staging.mjs
        env:
          NSK_AUTH_STAGING_URL: https://nsk-auth-staging.peter-hasselberg.workers.dev
