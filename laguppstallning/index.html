<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laguppställning</title>
  <meta name="theme-color" content="#b11226">
  <script src="../version.js?v=730"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>
  <style>
    /* Endast Laguppställning – påverkar inga andra sidor. */
    body.lineup-page { padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px)); }
    .lineup-page .wrap { max-width:1050px; }
    .lineup-page .card { margin-bottom:12px; padding:16px; }
    .lineup-page .card h2 { font-size:21px; margin:0 0 13px; }
    .lineup-page .field { min-width:0; margin-bottom:12px; }
    .lineup-page .field:last-child { margin-bottom:0; }
    .lineup-page .field > label { display:block; margin-bottom:5px; font-size:14px; }
    .lineup-page input:not([type=checkbox]),
    .lineup-page select { width:100%; min-width:0; min-height:44px; margin:0; padding:9px 12px; border-radius:11px; font-size:16px; }
    .lineup-page #lineupCoach[multiple] { display:none; }
    .lineup-page .coach-picker { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; margin-top:5px; }
    .lineup-page .coach-choice { display:block; width:100%; min-width:0; text-align:left; min-height:38px; padding:7px 10px; border:1px solid #44464e; border-radius:8px; cursor:pointer; background:#202127; color:#fff; font:inherit; touch-action:manipulation; }
    .lineup-page .coach-choice.selected { border-color:#e34a60; background:#432028; color:#fff; }


    .lineup-page #laguppstallningTeamButtons { display:flex; flex-wrap:wrap; gap:8px; }
    .lineup-page #laguppstallningTeamButtons button { flex:0 1 auto; min-width:105px; min-height:44px; padding:9px 16px; font-size:15px; border-radius:11px; }
    .lineup-page #matchButtons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .lineup-page #matchButtons button { width:100%; min-width:0; min-height:44px; margin:0; padding:9px 5px; border-radius:11px; font-size:15px; }
    .lineup-page #matchButtons button:not(.active-team-btn):not([aria-pressed="true"]),
    .lineup-page #laguppstallningTeamButtons button:not(.active-team-btn):not([aria-pressed="true"]) { background:#202127; border-color:#393941; box-shadow:none; }
    .lineup-page #matchButtons button.active-team-btn,
    .lineup-page #matchButtons button[aria-pressed="true"],
    .lineup-page #laguppstallningTeamButtons button.active-team-btn,
    .lineup-page #laguppstallningTeamButtons button[aria-pressed="true"] { background:linear-gradient(180deg,#c51b32,#8f1020); border-color:#e34a60; color:#fff; }
    .lineup-page .lineup-info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; }
    .lineup-page .lineup-info-grid .field { margin:0; }
    .lineup-page .lineup-info-grid input[type=time] { text-align:left; width:145px; max-width:100%; padding:8px 10px; min-height:42px; }
    .lineup-page .lineup-info-grid .field:first-child { justify-self:start; }
    .lineup-page #lineupSelectors button { width:auto; max-width:100%; }
    .lineup-page #lineupSelectors .btnrow { justify-content:flex-end; }
    .lineup-page #lineupSelectors .btnrow button { flex:0 0 auto; }
    .lineup-page #lineupSelectors { min-width:0; }
    .lineup-page #lineupSelectors .field { margin-bottom:9px; }
    .lineup-page #lineupSelectors label { font-size:14px; margin-bottom:4px; }
    .lineup-page #lineupSelectors select { min-height:43px; padding-top:8px; padding-bottom:8px; }
    .lineup-page #lineupSelectors button { min-height:42px; padding:8px 13px; font-size:15px; border-radius:11px; }
    .lineup-page .lineup-messages:empty { display:none; }
    .lineup-page .lineup-messages .small:empty { display:none; }
    @media(min-width:800px) {
      .lineup-page .lineup-main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start; }
      .lineup-page .lineup-main > .card { margin:0; }
      .lineup-page .lineup-players-card { margin-top:14px; }
    }
    @media(max-width:600px) {
      body.lineup-page { padding:9px 9px calc(100px + env(safe-area-inset-bottom,0px)); }
      .lineup-page .card { padding:13px; border-radius:15px; margin-bottom:10px; }
      .lineup-page .card h2 { font-size:19px; margin-bottom:10px; }
      .lineup-page .field { margin-bottom:10px; }
      .lineup-page .lineup-info-grid { gap:9px; }
      .lineup-page .lineup-info-grid .field > label { font-size:13px; }
      .lineup-page #laguppstallningTeamButtons button { min-width:95px; }
      .lineup-page .home-hero { margin-bottom:12px; }
    }
    @media(max-width:350px) {
      .lineup-page .lineup-info-grid { grid-template-columns:1fr; }
    }
    /* Målvakt och Spelare är separata rubriker. */
    .lineup-page #lineupSelectors .goalie-row { display:flex; align-items:end; gap:10px; margin-bottom:18px; }
    .lineup-page #lineupSelectors .goalie-col:first-child { flex:1 1 auto; min-width:0; }
    .lineup-page #lineupSelectors .goalie-random-col { flex:0 0 auto; }
    .lineup-page #lineupSelectors .goalie-random-col label { display:none; }
    .lineup-page #lineupSelectors .goalie-row label[for="lineupGoalie"] { display:none; }
    .lineup-page #lineupSelectors .goalie-random-col button { margin:0; min-height:44px; }
    .lineup-page #lineupSelectors .lineup-player-heading { font-size:21px; margin:16px 0 13px; font-weight:700; }
    @media(max-width:600px) { .lineup-page #lineupSelectors .lineup-player-heading { font-size:19px; } }
  </style>
</head>
<body class="lineup-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>
    <section class="home-hero">
      <div class="home-hero-logo-box"><img src="../icon-192.png" alt="NSK" class="home-hero-logo"></div>
      <div class="home-hero-text">
        <h1 id="laguppstallningTitle">Laguppställning</h1>
        <div class="home-hero-sub">Välj lag, match, spelare och tränare</div>
      </div>
    </section>
    <div class="lineup-main">
      <section class="card">
        <h2>Laguppställning</h2>
        <div class="field"><label>Lag</label><div id="laguppstallningTeamButtons" class="team-buttons"></div></div>
        <div class="field"><label for="lineupCoach">Tränare</label><select id="lineupCoach" multiple size="4"></select><div id="lineupCoachChoices" class="coach-picker" role="group" aria-label="Välj tränare"></div><div id="lineupCoachNames" class="small" aria-live="polite" style="margin-top:7px"></div></div>
        <div class="field"><label>Matcher</label><div id="matchButtons" class="team-buttons"></div></div>
        <div class="field" style="display:none"><label for="lineupMatch">Match</label><select id="lineupMatch"></select></div>
      </section>
      <section class="card">
        <h2>Matchinfo</h2>
        <div class="lineup-info-grid">
          <div class="field"><label for="lineupStartTime">Starttid</label><input id="lineupStartTime" type="time"></div>
          <div class="field"><label for="lineupOpponent">Motståndare</label><input id="lineupOpponent" type="text" placeholder="Motståndare"></div>
          <div class="field"><label for="lineupPlan">Plan</label><select id="lineupPlan"><option value="Plan 1">Plan 1</option><option value="Plan 2">Plan 2</option><option value="Plan 3">Plan 3</option><option value="Plan 4">Plan 4</option><option value="Plan 5">Plan 5</option></select></div>
          <div class="field"><label for="lineupPlayerCount">Antal spelare</label><select id="lineupPlayerCount"></select></div>
        </div>
      </section>
    </div>
    <section class="card lineup-players-card"><h2>Målvakt</h2><div id="lineupSelectors"></div></section>
    <section class="card lineup-messages"><div id="lineupMsg" class="small"></div><div id="appError" class="small"></div></section>
  </div>
  <script>
    document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
    document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
    document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
    document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
  </script>
  <script src="../admin-mode.js?v=1"></script>
  <script>
    // Tryckbara knappar fungerar likadant för val och bortval på iOS och dator.
    // Den dolda selecten är fortfarande datakällan för app.js.
    (function () {
      const select = document.getElementById('lineupCoach');
      const box = document.getElementById('lineupCoachChoices');
      const names = document.getElementById('lineupCoachNames');
      if (!select || !box || !names) return;
      function refresh() {
        const options = Array.from(select.options).filter(o => o.value);
        const selected = options.filter(o => o.selected);
        names.textContent = selected.length
          ? 'Valda tränare: ' + selected.map(o => o.textContent.trim()).join(', ')
          : 'Inga tränare valda';
        const signature = options.map(o => o.value + ':' + o.textContent).join('|');
        if (box.dataset.signature !== signature) {
          box.dataset.signature = signature;
          box.replaceChildren();
          options.forEach(o => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'coach-choice';
            button.dataset.coachId = o.value;
            button.textContent = o.textContent;
            button.addEventListener('click', () => {
              const current = Array.from(select.options).find(x => x.value === button.dataset.coachId);
              if (!current) return;
              current.selected = !current.selected;
              refresh();
              // Spara direkt från den synliga knappen. Ingen dubbel sparning via select-change.
              const poolId = sessionStorage.getItem('nsk2_pool_id');
              const lagNo = sessionStorage.getItem('nsk2_lag_nr') || '1';
              const matchNo = document.getElementById('lineupMatch')?.value || '1';
              const coachIds = Array.from(select.selectedOptions).map(o => Number(o.value)).filter(Number.isSafeInteger);
              const status = document.getElementById('lineupMsg');
              const error = document.getElementById('appError');
              if (!poolId) {
                if (error) error.textContent = 'Välj poolspel innan tränare sparas.';
                return;
              }
              if (typeof window.DB?.saveCoachSelection !== 'function') {
                if (error) error.textContent = 'Sparfunktionen saknas. Kontrollera att senaste db.js är publicerad.';
                return;
              }
              if (status) status.textContent = 'Sparar tränarval…';
              if (error) error.textContent = '';
              // Ordna samtidiga tryck så att sista valet sparas sist.
              window.__nskCoachButtonSave = (window.__nskCoachButtonSave || Promise.resolve())
                .catch(() => {})
                .then(async () => {
                  try {
                    await window.DB.saveCoachSelection(poolId, lagNo, matchNo, coachIds);
                    if (sessionStorage.getItem('nsk2_pool_id') === poolId &&
                        (sessionStorage.getItem('nsk2_lag_nr') || '1') === lagNo &&
                        (document.getElementById('lineupMatch')?.value || '1') === matchNo) {
                      if (status) status.textContent = 'Tränarval sparat för Match ' + matchNo + '.';
                      if (error) error.textContent = '';
                    }
                  } catch (err) {
                    if (error) error.textContent = 'Tränarval kunde inte sparas: ' + (err?.message || String(err));
                    if (status) status.textContent = '';
                  }
                });
            });
            box.appendChild(button);
          });
        }
        box.querySelectorAll('button[data-coach-id]').forEach(button => {
          const option = options.find(o => o.value === button.dataset.coachId);
          const checked = !!option?.selected;
          button.setAttribute('aria-pressed', String(checked));
          button.classList.toggle('selected', checked);
        });
        if (!options.length) box.textContent = 'Inga tränare tillgängliga';
      }
      select.addEventListener('change', refresh);
      select.addEventListener('lineup-coaches-refresh', refresh);
      new MutationObserver(refresh).observe(select, { childList: true, subtree: true });
      refresh();
    })();
  </script>

  <script>
    // app.js skapar spelarväljare dynamiskt. Lägg till en riktig rubrik
    // före Spelare 1 varje gång innehållet uppdateras, utan att ändra app.js.
    (function () {
      const box = document.getElementById('lineupSelectors');
      if (!box) return;
      function ensurePlayerHeading() {
        const first = box.querySelector('[data-player-label="1"]');
        if (!first || box.querySelector('.lineup-player-heading')) return;
        const heading = document.createElement('h2');
        heading.className = 'lineup-player-heading';
        heading.textContent = 'Spelare';
        first.before(heading);
      }
      new MutationObserver(ensurePlayerHeading).observe(box, {childList:true});
      ensurePlayerHeading();
    })();
  </script>
</body>
</html>
