# Production authentication, isolated from staging and the existing nsk-api Worker.
# Account activation and recovery require migrations/20261025_account_recovery.sql.
# Email delivery stays disabled until a verified sender and ACCOUNT_EMAIL binding are configured.
name = "nsk-auth"
main = "worker/production-entry.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "AUTH_DB"
database_name = "nsk-auth-production"
database_id = "9f937bcb-b0c0-4129-af5b-775cf284dfcb"

# Persist automatic request status/timing logs with query strings removed.
# Never add credential, request-body or unredacted-header console logging.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = false
