<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bytesschema</title>
  <meta name="theme-color" content="#b11226">
  <script src="../version.js?v=742"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>
  <style>
    /* Sidunik layout: påverkar inte andra sidor eller JavaScript. */
    .shift-top-grid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 2fr); gap:16px; align-items:start; margin:16px 0; }
    .shift-top-grid > .card { margin:0; min-width:0; height:100%; }
    .shift-top-grid h2 { margin-top:0; }
    #shiftTeamButtons { display:flex; flex-wrap:wrap; gap:10px; }
    #shiftMatchList { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:0; }
    #shiftMatchList > * { min-width:0; width:100%; margin:0; }
    #shiftMatchList button { width:100%; min-width:0; }
    /* Klick på texten ska träffa knappen som app.js lyssnar på. */
    #shiftMatchList button * { pointer-events:none; }
    #shiftTeamButtons button * { pointer-events:none; }
    /* Rullistan behålls i DOM för app.js men visas inte. */
    .shift-match-select { display:none !important; }
    .shift-match-select label { margin:0; }
    .shift-match-select select { margin:0; width:100%; min-width:0; }
    .shift-info-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 18px; }
    .shift-info-grid > div { min-width:0; overflow-wrap:anywhere; }
    .shift-info-grid .shift-info-name { display:block; font-size:.88em; opacity:.75; margin-bottom:3px; }
    @media(max-width:720px) {
      .shift-top-grid { grid-template-columns:1fr; gap:12px; }
      #shiftMatchList { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
      .shift-info-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media(max-width:420px) {
      #shiftMatchList { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/" class="active">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>

    <section class="home-hero">
      <div class="home-hero-logo-box">
        <img src="../icon-192.png" alt="NSK" class="home-hero-logo">
      </div>
      <div class="home-hero-text">
        <h1 id="bytesschemaTitle">Bytesschema</h1>
        <div class="home-hero-sub" id="shiftHeaderMain">Lag 1</div>
      </div>
    </section>

    <div class="shift-top-grid">
    <section class="card">
      <h2>Lag</h2>
      <div id="shiftTeamButtons" class="team-buttons"></div>
    </section>

    <section class="card">
      <h2>Matcher</h2>
      <div id="shiftMatchList" class="team-buttons"></div>
      <div class="shift-match-select">
        <label for="shiftMatch">Välj match</label>
        <select id="shiftMatch" aria-label="Välj match"></select>
      </div>
    </section>
    </div>

    <section class="card">
      <h2>Matchinformation</h2>
      <div class="shift-info-grid">
        <div><span class="shift-info-name">Starttid</span><span id="shiftStart">—</span></div>
        <div><span class="shift-info-name">Datum</span><span id="shiftDate">—</span></div>
        <div><span class="shift-info-name">Motståndare</span><span id="shiftOpponent">—</span></div>
        <div><span class="shift-info-name">Plan</span><span id="shiftPlan">—</span></div>
        <div><span class="shift-info-name">Målvakt</span><span id="shiftGoalieName">—</span></div>
        <div><span class="shift-info-name">Tränare</span><span id="shiftCoachNames">—</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Byten</h2>
      <div id="shiftTableWrap"></div>
      <div id="shiftAllMatchesWrap"></div>
      <div id="shiftMsg" class="small"></div>
    </section>

    <div id="appError" class="small"></div>
    <script>
      document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
    </script>
  </div>
  <script src="../admin-mode.js?v=1"></script>
</body>
</html>
