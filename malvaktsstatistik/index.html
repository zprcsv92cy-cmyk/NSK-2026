<!doctype html>
<html lang="sv">
<head>
<link rel="apple-touch-icon" href="../home-icon-black.png">
<meta name="apple-mobile-web-app-title" content="NSK">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../shell-entry.js"></script>
<script>document.documentElement.style.visibility='hidden';</script>
<script src="../config.js"></script>
<script src="../login-gate.js"></script>
  <title>Statistik</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=872"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>
  <style>
    /* Endast denna sida: samma loggstorlek som Truppen. */
    .goalie-stats-page .home-hero-logo-box {
      flex: 0 0 72px;
      width: 72px;
      max-width: 72px;
    }
    .goalie-stats-page .home-hero-logo {
      display: block;
      width: 72px;
      max-width: 100%;
      height: auto;
    }
  </style>
  <style>
    .player-match-stats { width:100%; border-collapse:collapse; table-layout:fixed; }
    .player-match-stats th,.player-match-stats td { padding:12px 4px; border-bottom:1px solid #334250; text-align:center; }
    .player-match-stats th:first-child { width:54%; text-align:left; overflow-wrap:anywhere; }
    .player-match-stats tbody th { font-weight:500; }
    .goalie-print-row { display:flex; justify-content:flex-end; margin:0 0 12px; }
    .goalie-print-row button { width:auto; min-height:36px; margin:0; padding:7px 12px; font-size:12px; font-weight:600; border-radius:9px; }
    @media print {
      @page { margin:10mm; }
      body { background:#fff !important; color:#111 !important; padding:0 !important; }
      .mainmenu, .goalie-print-row, #appError, button { display:none !important; }
      .wrap { max-width:none !important; margin:0 !important; padding:0 !important; }
      .home-hero { margin:0 0 8mm !important; }
      .home-hero-logo-box { display:none !important; }
      .card { background:#fff !important; color:#111 !important; border:1px solid #bbb !important; box-shadow:none !important; break-inside:avoid; }
      h1, h2, p, label, #goalieStatsList, #goalieStatsList * { color:#111 !important; background:#fff !important; }
    }
  </style>
<script>document.write('<script src="../navigation.js?v='+window.NSK_VERSION+'" defer><\/script>');</script>
</head>
<body class="goalie-stats-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/">Kalender</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/" class="active">Statistik</a>
    </nav>

    <section class="home-hero">
      <div class="home-hero-logo-box">
        <img src="../icon-192.png" alt="NSK" class="home-hero-logo">
      </div>
      <div class="home-hero-text">
        <h1>Statistik</h1>
        <div class="home-hero-sub">Antal matcher som målvakt och utespelare.</div>
      </div>
    </section>

    <div class="goalie-print-row"><button id="goaliePrintButton" type="button">Skriv ut statistik / PDF</button></div>

    <section class="card">
      <h2>Spelade matcher</h2>
      <p class="small">Avslutade poolspel räknas från sparade uppställningar. I pågående matcher räknas genomförda byten. Planerade matcher räknas inte.</p>
      <div id="goalieStatsList"></div>
    </section>

    <div id="appError" class="small"></div>
<script>
  document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
</script>
  </div>
<script>document.getElementById("goaliePrintButton")?.addEventListener("click", () => { if (typeof window.print === "function") window.print(); });</script>

</body>
</html>
