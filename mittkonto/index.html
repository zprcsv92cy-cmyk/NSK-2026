<!doctype html>
<html lang="sv">
<head>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../home-icon-black.png">
<meta name="apple-mobile-web-app-title" content="NSK">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../shell-entry.js"></script>
<script>document.documentElement.style.visibility='hidden';</script>
<script src="../config.js"></script>
<script src="../login-gate.js"></script>
<title>Mitt konto – NSK</title>
<meta name="theme-color" content="#b11226">
<script src="../version.js?v=872"></script>
<script>
document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
</script>
<script>document.write('<script src="../navigation.js?v='+window.NSK_VERSION+'" defer><\/script>');</script>
<style>#passwordChangeSection{max-width:650px;margin:18px auto}#changePasswordForm{display:grid;gap:12px}#changePasswordForm label{display:grid;gap:5px}#changePasswordForm input{width:100%;box-sizing:border-box}</style>
</head>
<body>
<div class="wrap">
<nav class="mainmenu"><a href="../startsida/">Kalender</a><a href="../truppen/">Truppen</a><a href="../skapapoolspel/">Skapa poolspel</a><a href="./" class="active">Mitt konto</a></nav>
<section class="card">
<h1>Mitt konto</h1>
<p id="accountStatus" aria-live="polite">Kontrollerar inloggning…</p>
<div id="accountDetails" hidden>
<p id="accountName"></p>
<h2>Mina lag</h2>
<ul id="accountTeams"></ul>
<label>Välj aktivt lag <select id="accountTeamSelect"></select></label>
<h2>Mina behörigheter</h2>
<ul id="accountPermissions"></ul>
<p class="small">Behörigheterna kontrolleras mot servern för valt lag. ”Nej” kan också visas om servern inte går att nå.</p>
<p id="accountAppVersion" class="small"></p>
<button type="button" id="accountLogout">Logga ut</button>
</div>
<p><a href="../login/" id="accountLogin" hidden>Logga in</a></p>
</section>
<section id="passwordChangeSection" class="card" hidden><h2>Byt lösenord</h2><form id="changePasswordForm"><label>Nuvarande lösenord<input id="currentPassword" type="password" autocomplete="current-password" required maxlength="1024"></label><label>Nytt lösenord (minst 12 tecken)<input id="changeNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Bekräfta nytt lösenord<input id="changeConfirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><button id="changePasswordSubmit" class="nsk-action nsk-action--save" type="submit">Byt lösenord</button><p id="changePasswordMessage" role="status"></p></form></section>
</div>
<script>
(async () => {
 const status=document.getElementById('accountStatus');
 try {
  const identity=await Auth.init();
  if (!identity) {
   status.textContent='Du är inte inloggad.';
   document.getElementById('accountLogin').hidden=false;
   return;
  }
  status.textContent='Inloggad';
  document.getElementById('accountAppVersion').textContent='Appversion '+(window.NSK_APP_VERSION||'1.0');
  if(identity.is_primary_admin===true){
   const special=document.createElement('a');
   special.id='accountSpecialFeatures';
   special.className='nsk-action';
   special.href='../skills/';
   special.textContent='Specialfunktioner';
   const actions=document.createElement('p');
   actions.append(special);
   document.getElementById('accountDetails').prepend(actions);
  }
  document.getElementById('accountName').textContent='Namn: '+(identity.user?.name||identity.user?.email||'Användare');
  const list=document.getElementById('accountTeams');
  const select=document.getElementById('accountTeamSelect');
  const permissions=document.getElementById('accountPermissions');
  const permissionLabels=[
   ['read','Läsa'],['pool','Skapa poolspel'],['lineup','Ändra laguppställning'],
   ['shifts','Checka byten'],['matches','Hantera matchvy'],
   ['pool_finish','Avsluta poolspel'],['pool_reopen','Återöppna poolspel'],
   ['roster','Hantera truppen'],['users','Hantera användare']
  ];
  let permissionRequest=0;
  const renderPermissions=async()=>{
   const request=++permissionRequest;
   permissions.replaceChildren();
   const team=Auth.activeTeam();
   if(!team){
    const item=document.createElement('li');
    item.textContent='Välj ett lag för att visa behörigheter.';
    permissions.append(item);
    return;
   }
   const pending=document.createElement('li');
   pending.textContent='Kontrollerar behörigheter mot servern…';
   permissions.append(pending);
   const results=await Promise.all(permissionLabels.map(async ([key,label])=>({
    label, allowed:key==='read'?Auth.can('read',team):await Auth.checkTeamFeature(key,team)
   })));
   if(request!==permissionRequest || Auth.activeTeam()!==team)return;
   permissions.replaceChildren();
   for(const result of results){
    const item=document.createElement('li');
    item.textContent=(result.allowed?'Ja – ':'Nej – ')+result.label;
    permissions.append(item);
   }
  };
  const renderTeams=()=>{
   list.replaceChildren();
   for(const membership of identity.memberships){
    const item=document.createElement('li');
    item.textContent=(membership.team_name||membership.team_id)+(membership.team_id===Auth.activeTeam()?' (aktivt lag)':'');
    list.append(item);
   }
   if(!identity.memberships.length){const item=document.createElement('li');item.textContent='Inga lag kopplade till kontot.';list.append(item);}
  };
  for(const membership of identity.memberships){
   const option=document.createElement('option');
   option.value=membership.team_id;
   option.textContent=membership.team_name||membership.team_id;
   select.append(option);
  }
  select.disabled=!identity.memberships.length;
  if (identity.memberships.length && !Auth.activeTeam()) Auth.selectTeam(identity.memberships[0].team_id);
  select.value=Auth.activeTeam()||'';
  select.addEventListener('change',()=>{
   try { Auth.selectTeam(select.value); renderTeams(); renderPermissions(); status.textContent='Aktivt lag uppdaterat.'; }
   catch(error){status.textContent=error.message||'Kunde inte byta lag';select.value=Auth.activeTeam()||'';}
  });
  document.getElementById('accountLogout').addEventListener('click',async()=>{
   await Auth.logout();
   document.getElementById('accountDetails').hidden=true;
   document.getElementById('accountLogin').hidden=false;
   status.textContent='Du är utloggad.';
  });
  renderTeams();
  renderPermissions();
  document.getElementById('accountDetails').hidden=false;
 } catch {
  status.textContent='Kontot kunde inte kontrolleras just nu.';
 }
})();
</script>

<script>document.write('<script src="../account-access.js?v='+window.NSK_VERSION+'"><\/script>');</script>
</body>
</html>
