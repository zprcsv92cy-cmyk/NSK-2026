<style>
.cup-page .wrap{max-width:960px}.cup-import{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.cup-import label,.cup-editor label{display:grid;gap:7px;min-width:0}.cup-page input,.cup-page textarea,.cup-page select{box-sizing:border-box;width:100%;min-width:0;font:inherit;font-size:16px}.cup-page button{min-height:44px}.cup-page .cup-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.cup-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.cup-facts dt{font-size:.8rem;opacity:.75}.cup-facts dd{margin:4px 0 0;overflow-wrap:anywhere}.cup-source-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.cup-list{display:grid;gap:12px}.cup-list summary{padding:16px;cursor:pointer;display:grid;gap:5px}.cup-list summary strong{font-size:1.05rem}.cup-content{padding:0 16px 16px}.cup-table-wrap{overflow:auto}.cup-page table{min-width:500px;font-size:.85rem}.cup-page td,.cup-page th{padding:8px;white-space:pre-wrap}.cup-editor-fields{display:grid;grid-template-columns:1fr;gap:14px}.cup-warning{color:#ffd0a0}.cup-status:empty{display:none}@media(max-width:600px){.cup-import,.cup-facts{grid-template-columns:1fr}.cup-import button{width:100%;margin:0}.cup-actions button{flex:1}.cup-page .card{padding:16px}}

#cupSearchResults{gap:8px}#cupSearchResults>.cup-result{padding:0;overflow:hidden;margin:0}#cupSearchResults>.cup-result>summary{position:relative;display:grid;gap:4px;padding:12px 38px 12px 14px;list-style:none;min-height:44px;box-sizing:border-box}#cupSearchResults>.cup-result>summary::-webkit-details-marker{display:none}#cupSearchResults>.cup-result>summary strong{font-size:1rem;line-height:1.3;overflow-wrap:anywhere}.cup-result-meta{font-size:.85rem;line-height:1.4;color:#b9c5d0;overflow-wrap:anywhere}.cup-result-hint{font-size:.78rem;color:#9eafbf}.cup-result-chevron{position:absolute;right:14px;top:16px;font-size:1.15rem;transition:transform .15s}.cup-result[open]>summary .cup-result-chevron{transform:rotate(180deg)}.cup-result-content{padding:0 14px 12px}.cup-result-content h4{margin:8px 0 5px}.cup-result-content .cup-source-text{font-size:.88rem;line-height:1.45;margin:6px 0}.cup-result-content .cup-actions{margin-top:10px}.cup-result>summary:focus-visible{outline:2px solid #f52b59;outline-offset:-3px}
</style></head><body class="nsk-arena cup-page"><div class="wrap"><nav class="mainmenu"></nav><h1>Cupplanerare</h1>
<section class="card"><h2>Hitta kommande cuper</h2><form id="cupSearchForm" class="cup-import"><label>Åldersklass<select id="cupAge" aria-label="Åldersklass"><option value="U9">U9</option></select></label><button id="cupFind" class="nsk-action nsk-action--primary" type="submit">Sök cuper</button></form><p id="cupSearchStatus" role="status" aria-live="polite"></p><div id="cupSearchResults" class="cup-list"></div><button id="cupMore" type="button" hidden>Visa fler cuper</button><p class="small"><a href="https://cuponline.se/web/default.aspx?nomobile=true" target="_blank" rel="noopener noreferrer">Källa: Cuponline</a></p></section>
<section class="card" id="cupImportSection"><h2>Lägg till cup</h2><form id="cupImportForm" class="cup-import"><label>Adress till Cuponline<input id="cupUrl" type="url" required inputmode="url" placeholder="https://cuponline.se/start.aspx?cupid=39900" autocomplete="off"></label><button id="cupFetch" class="nsk-action nsk-action--primary" type="submit" disabled>Hämta uppgifter</button></form><p class="small">Granska uppgifterna innan du sparar cupen.</p></section>

<section class="card cup-editor" id="cupEditor" hidden><h2 id="cupEditorTitle">Granska cup</h2><div id="cupPreview"></div><form id="cupSaveForm"><div class="cup-editor-fields"><label>Status<select id="cupPlanStatus"><option>Planerad</option><option>Anmäld</option><option>Avslutad</option></select></label><label>Egna anteckningar<textarea id="cupNotes" rows="4" maxlength="5000" placeholder="Till exempel samling, resa och material"></textarea></label></div><div class="cup-actions"><button id="cupSave" class="nsk-action nsk-action--save" type="submit">Spara cup</button><button id="cupRefresh" type="button">Uppdatera från Cuponline</button><button id="cupCancel" type="button">Stäng</button></div></form></section>
<section><h2>Planerade cuper</h2><div id="cupList" class="cup-list"></div><button id="cupReload" type="button">Uppdatera listan</button></section>
</div></body></html>
