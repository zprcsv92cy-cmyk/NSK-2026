# Production API candidate. Never deploy before live binding IDs and rollback are verified.
name = "nsk-api"
main = "worker/production-api-v42-reference.js"
compatibility_date = "2026-10-10"
workers_dev = true

# Production authentication database; existing nsk-auth D1 instance.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "nsk-auth-production"
database_id = "9f937bcb-b0c0-4129-af5b-775cf284dfcb"

# REQUIRED BEFORE DEPLOYMENT:
# - Copy the live ADMIN_KV namespace ID (never create a new empty namespace).
# - Copy the live NSK_TRAINERS namespace ID (existing staff data).
# - Restore SHIFT_LOCK Durable Object binding, migration history and class ownership.
# - Verify BASEROW_TOKEN, BASEROW_DATABASE_ID, ADMIN_PASSWORD, MATCH_PASSWORD secrets.
# - Verify a rollback to the currently deployed Worker v42.
# This file remains intentionally incomplete and is NOT a deployable manifest.
