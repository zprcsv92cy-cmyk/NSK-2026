# Production API candidate. Never deploy before live binding IDs and rollback are verified.
name = "nsk-api"
main = "worker/production-api-v42-reference.js"
compatibility_date = "2026-10-10"
workers_dev = true

# Scheduled every six hours; writes are limited to calendar-owned D1 cache rows.
[triggers]
crons = ["15 */6 * * *"]

[vars]
NSK_ENABLE_SVENSKALAG_AUTO_SYNC = "true"
NSK_SVENSKALAG_TEAM_ID = "NSK Team 18"
BASEROW_DATABASE_ID = "589073"
# Current scoped-roster production mode. All roster GETs must use a personal
# Bearer token and selected team; legacy unauthenticated roster reads fail closed.
NSK_REQUIRE_SCOPED_ROSTER_READS = "true"
NSK_REQUIRE_SCOPED_TEAM_READS = "true"
NSK_REQUIRE_SCOPED_COLLECTION_READS = "true"
# Shared training is enabled: D1 migration is verified and existing production setting is true.
NSK_ENABLE_SHARED_TRAINING = "true"
# Keep legacy pool writes until the new personal-session client is explicitly enabled.
NSK_REQUIRE_PERSONAL_POOL_WRITES = "true"
NSK_REQUIRE_PERSONAL_MATCH_WRITES = "true"
# Enable only after coordinated client + Worker verification.
NSK_REQUIRE_PERSONAL_COACH_SELECTION = "true"
NSK_DISABLE_LEGACY_AUTH = "true"

# Validate that existing secrets are present; do not store their values here.
[secrets]
required = ["ADMIN_PASSWORD", "BASEROW_TOKEN", "MATCH_PASSWORD"]

# Production authentication database; existing nsk-auth D1 instance.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "nsk-auth-production"
database_id = "9f937bcb-b0c0-4129-af5b-775cf284dfcb"

# Verified against Cloudflare deployed version 95247668-0e10-4ba3-b6c5-469ed37a986c.
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "7f978e9bbcd04b888e5b0dfbc338ba5d"

[[kv_namespaces]]
binding = "NSK_TRAINERS"
id = "f60b048621ea4aca8d67774f5c9db664"

[durable_objects]
[[durable_objects.bindings]]
name = "SHIFT_LOCK"
class_name = "ShiftLock"

# Preserve the existing ShiftLock class and SQLite storage; do not create a
# new class or replace the existing namespace during this release.
[exports.ShiftLock]
type = "durable-object"
storage = "sqlite"

# REQUIRED BEFORE DEPLOYMENT:
# - Confirm live KV access and preserve existing staff records in NSK_TRAINERS.
# - Verify the existing SHIFT_LOCK migration history and object ownership.
# - Verify the required secrets are present without exposing their values.
# - Verify rollback and persistent-data recovery separately.
# - Complete non-destructive production smoke checks and obtain release approval.
# This manifest is not itself deployment authorization.
