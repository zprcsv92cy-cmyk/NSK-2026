# Production API candidate. Never deploy before live binding IDs and rollback are verified.
name = "nsk-api"
main = "worker/production-api-v42-reference.js"
compatibility_date = "2026-10-10"
workers_dev = true

# Validate that existing secrets are present; do not store their values here.
[secrets]
required = ["ADMIN_PASSWORD", "BASEROW_TOKEN", "MATCH_PASSWORD"]

# Production authentication database; existing nsk-auth D1 instance.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "nsk-auth-production"
database_id = "9f937bcb-b0c0-4129-af5b-775cf284dfcb"

# Verified against Cloudflare deployed version 95247668-0e10-4ba3-b6c5-469ed37a986c.
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "7f978e9bbcd04b888e5b0dfbc338ba5d"

[[kv_namespaces]]
binding = "NSK_TRAINERS"
id = "f60b048621ea4aca8d67774f5c9db664"

[durable_objects]
[[durable_objects.bindings]]
name = "SHIFT_LOCK"
class_name = "ShiftLock"

# Existing production namespace verified using a read-only SQLite query.
# No migration or namespace replacement is performed.
[[migrations]]
tag = "v1-shift-lock"
new_sqlite_classes = ["ShiftLock"]

# REQUIRED BEFORE DEPLOYMENT:
# - Confirm KV access using the verified live namespace IDs above.
# - Preserve existing staff records in NSK_TRAINERS.
# - Verify SHIFT_LOCK migration history and existing object ownership before deployment.
# - Verify BASEROW_TOKEN, BASEROW_DATABASE_ID, ADMIN_PASSWORD, MATCH_PASSWORD secrets.
# - Verify a rollback to the currently deployed Worker v42.
# This file remains intentionally incomplete and is NOT a deployable manifest.
