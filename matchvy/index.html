<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Matchvy</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=842"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>
  <style>
    /* Endast Matchvy: rubrik och logga som på Truppen. */
    .matchview-wrap .matchview-hero {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .matchview-wrap .matchview-hero-logo {
      display: block;
      width: 72px;
      height: 72px;
      object-fit: contain;
      flex: 0 0 72px;
    }
    .matchview-wrap .matchview-hero-title {
      margin: 0;
    }
    @media (max-width: 480px) {
      .matchview-wrap .matchview-hero { gap: 12px; }
    }

    /* Kompakt matchvy: enbart visuell justering, inga ändrade ID:n eller skript. */
    .matchview-wrap .matchview-hero {
      padding: 10px 16px;
      margin-bottom: 10px;
    }
    .matchview-wrap .matchview-hero-logo {
      width: 72px;
      height: 72px;
    }
    .matchview-wrap .v726-coach-card {
      padding: 16px 18px;
    }
    .matchview-wrap .coach-big-title {
      margin: 0 0 8px;
      line-height: 1.15;
    }
    .matchview-wrap .coach-match-info {
      margin: 0 0 12px;
      line-height: 1.35;
    }
    .matchview-wrap .coach-match-info p,
    .matchview-wrap .coach-match-info > div {
      margin-top: 3px;
      margin-bottom: 3px;
    }
    .matchview-wrap .coach-byte-meta-box {
      padding: 9px 12px;
      margin: 10px 0 8px;
      line-height: 1.3;
    }
    .matchview-wrap .coach-panel.compact-panel {
      padding: 10px 14px;
      margin: 0 0 10px;
    }
    .matchview-wrap .coach-panel-label-big {
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .matchview-wrap .coach-panel-main-big,
    .matchview-wrap .coach-panel-next-big {
      line-height: 1.15;
    }
    .matchview-wrap .compact-nav-row {
      margin-top: 12px;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .matchview-wrap .v726-coach-card { padding: 12px; }
      .matchview-wrap .coach-panel.compact-panel { padding: 10px; }
      .matchview-wrap .coach-byte-meta-box { padding: 8px 10px; }
      .matchview-wrap .compact-nav-row { display: flex; flex-wrap: wrap; }
      .matchview-wrap .compact-nav-row > button { flex: 1 1 130px; }
    }
    /* Endast textfärger för NU och NÄSTA. */
    .matchview-wrap .v726-now-panel .coach-panel-label { color: #008000 !important; }
    .matchview-wrap .v726-next-panel .coach-panel-label { color: #d00000 !important; }
  </style>
</head>
<body>
  <div class="wrap matchview-wrap">
    <nav class="mainmenu compact-mainmenu">
      <a href="../startsida/">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/" class="active">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>

    <section class="hero-card matchview-hero">
      <img src="../icon-192.png" alt="NSK" class="matchview-hero-logo">
      <div>
        <h1 class="hero-title matchview-hero-title">Matchvy</h1>
      </div>
    </section>

    <section class="card coach-mode-card iphone-match-card v726-coach-card">
      <div id="shiftLabel" class="coach-big-title">Inget schema</div>
      <div id="matchInfo" class="coach-match-info"></div>

      <div id="currentShiftMeta" class="coach-byte-meta-box single-meta">Pågående byte: —</div>
      <div class="coach-panel compact-panel v726-now-panel">
        <div class="coach-panel-label coach-panel-label-big">NU</div>
        <div id="currentPlayers" class="coach-panel-main coach-panel-main-big">—</div>
      </div>

      <div id="nextShiftMeta" class="coach-byte-meta-box single-meta">Nästa byte: —</div>
      <div class="coach-panel compact-panel v726-next-panel">
        <div class="coach-panel-label coach-panel-label-big">NÄSTA</div>
        <div id="nextPlayers" class="coach-panel-next coach-panel-next-big">—</div>
      </div>

      <div class="btnrow compact-nav-row">
        <button id="prevShiftBtn" class="row-btn coach-nav-btn ghost nsk-action nsk-action--neutral" type="button">Föregående byte</button>
        <button id="nextShiftBtn" class="row-btn coach-nav-btn nsk-action nsk-action--primary" type="button">Nästa byte</button>
      </div>
    </section>

    <div id="appError" class="small"></div>
    <script>
      document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
      document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
    </script>
  </div>
<script src="../admin-mode.js?v=1"></script>
</body>
</html>
