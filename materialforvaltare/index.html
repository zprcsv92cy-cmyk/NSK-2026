<style>
.equipment-form{display:grid;gap:12px;padding:14px 0}.equipment-form label{display:grid;gap:6px}.equipment-form input,.equipment-form select,.equipment-form textarea{width:100%;min-width:0;box-sizing:border-box}.equipment-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.equipment-row label{display:flex;gap:10px;align-items:center;flex:1;min-width:0}.equipment-row input[type=checkbox]{width:22px;height:22px;flex:none}.equipment-row small{display:block;color:var(--muted)}.equipment-row button{flex:none;min-height:44px}.equipment-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.equipment-actions button{min-height:44px}.equipment-done label>span{text-decoration:line-through}.equipment-list{margin-top:16px}#equipmentTeam{color:var(--muted)}[hidden]{display:none!important}
.equipment-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.equipment-toolbar #equipmentStatus{flex:1;margin:0;font-size:.85rem;line-height:1.5}.equipment-toolbar button{min-height:40px;flex:none;font-size:.8rem}.equipment-box{padding:0!important;overflow:hidden;margin-bottom:16px}.equipment-box>summary,.equipment-slip>summary,.equipment-checklist>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;cursor:pointer;min-height:54px;padding:16px}.equipment-box>summary::-webkit-details-marker,.equipment-slip>summary::-webkit-details-marker,.equipment-checklist>summary::-webkit-details-marker{display:none}.equipment-box>summary:after,.equipment-slip>summary:after,.equipment-checklist>summary:after{content:'⌄';flex:none;color:var(--muted);transition:transform .15s}.equipment-box[open]>summary:after,.equipment-slip[open]>summary:after,.equipment-checklist[open]>summary:after{transform:rotate(180deg)}.equipment-box>summary h2{margin:0;font-size:1.08rem}.equipment-box-heading{flex:1;min-width:0}.equipment-box-heading small{display:block;margin-top:5px;color:var(--muted);font-size:.8rem}.equipment-box-body{padding:0 16px 16px}.equipment-section-title{font-size:1.08rem;margin:0}.equipment-checklist,.equipment-slip{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#151c2580;overflow:hidden}.equipment-slip>summary,.equipment-checklist>summary{padding:13px 12px;flex-wrap:wrap;gap:8px}.equipment-slip-name,.equipment-checklist-name{flex:1;min-width:100px;overflow-wrap:anywhere}.equipment-slip-name small,.equipment-checklist-name small{display:block;margin-top:4px;color:var(--muted);font-size:.78rem}.equipment-lamp{display:inline-flex;align-items:center;gap:7px;flex:none;font-size:.78rem;color:#ff9caa}.equipment-lamp-dot{width:10px;height:10px;border-radius:50%;background:#f13e58;box-shadow:0 0 8px #f13e5844;flex:none}.equipment-lamp--done{color:#8ee0a8}.equipment-lamp--done .equipment-lamp-dot{background:#32c66b;box-shadow:0 0 8px #32c66b44}.equipment-slip-body,.equipment-checklist-body{padding:0 12px 14px}.equipment-skate-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}.equipment-skate-facts>div{min-width:0;background:#ffffff05;border-radius:8px;padding:10px}.equipment-skate-facts dt{color:var(--muted);font-size:.76rem;margin-bottom:5px}.equipment-skate-facts dd{margin:0;overflow-wrap:anywhere;font-size:.9rem;font-weight:600}.equipment-slip-notes{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;color:var(--muted);line-height:1.5}.equipment-create{margin-top:14px}.equipment-create>summary{cursor:pointer;min-height:44px;line-height:44px;font-size:.9rem}#checklistCreateButton{min-height:44px;margin-top:14px}.equipment-progress{font-size:.8rem;color:var(--muted)}@media(max-width:380px){.equipment-box-body{padding:0 12px 12px}.equipment-lamp{font-size:.73rem}.equipment-slip>summary{gap:6px}}
</style></head><body><div class="wrap">
<nav class="mainmenu"></nav>
<section class="home-hero"><div class="home-hero-logo-box"><img class="home-hero-logo" src="../icon-192.png" alt="NSK"></div><div class="home-hero-text"><h1>Materialförvaltare</h1><div class="home-hero-sub">Slipning och lagets checklistor</div></div></section>
<p id="equipmentTeam"></p><div class="equipment-toolbar"><p id="equipmentStatus" role="status" aria-live="polite">Hämtar materialuppgifter…</p><button type="button" id="equipmentReload">Ladda om</button></div>
<details class="card equipment-box" id="sharpeningBox"><summary><div class="equipment-box-heading"><h2>Skridskoslipning</h2><small id="sharpeningCount">Slipönskemål för spelare och tränare</small></div></summary><div class="equipment-box-body">
<div id="sharpeningList" class="equipment-list"></div>
<details class="equipment-create" id="sharpeningCreate" hidden><summary>Önska slipning</summary><form id="sharpeningForm" class="equipment-form" hidden><label>Spelare eller tränare<select id="equipmentPerson" required><option value="">Välj person</option></select></label><p id="equipmentSkates" class="small" role="status"></p><label>Önskemål eller kommentar<input id="equipmentNote" maxlength="300" placeholder="Till exempel inför nästa träning"></label><button class="nsk-action nsk-action--save" type="submit">Önska slipning</button></form></details>
</div></details>
<section class="card equipment-box"><div class="equipment-box-body" style="padding-top:16px"><h2 class="equipment-section-title">Checklistor</h2><div id="equipmentChecklists" class="equipment-list"></div>
<button type="button" id="checklistCreateButton" aria-expanded="false" aria-controls="checklistForm" hidden>Skapa checklistor</button>
<form id="checklistForm" class="equipment-form" hidden><h3 id="checklistEditorTitle">Skapa checklista</h3><label>Namn<input id="checklistTitle" maxlength="100" required placeholder="Material bortamatch"></label><label>Material – en sak per rad<textarea id="checklistItems" rows="6" maxlength="15000" required placeholder="Puckar&#10;Vattenflaskor&#10;Matchtröjor"></textarea></label><div class="equipment-actions"><button type="button" id="equipmentAwayTemplate">Mall: Material bortamatch</button><button id="checklistSaveButton" class="nsk-action nsk-action--save" type="submit">Spara checklista</button><button type="button" id="checklistCancel">Avbryt</button></div></form>
</div></section>
<details id="sharpeningLinksBox" class="card equipment-box sharpening-link-manager" hidden><summary><div class="equipment-box-heading"><h2>Personliga slipningslänkar</h2><small>Förälder eller spelare – utan appkonto</small></div></summary><div class="equipment-box-body"><label class="sharpening-link-label">Välj spelare<select id="sharpeningLinkPerson"><option value="">Välj spelare</option></select></label><div id="equipmentLinkManager"></div></div></details>
</div></body></html>
