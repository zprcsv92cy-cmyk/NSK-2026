<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skapa poolspel</title>
  <meta name="theme-color" content="#b11226">

  <script src="../version.js?v=715"></script>
  <script>
    document.write('<link rel="manifest" href="../manifest.webmanifest?v=' + window.NSK_VERSION + '">');
    document.write('<link rel="stylesheet" href="../app.css?v=' + window.NSK_VERSION + '">');
  </script>

  <style>
    /* Endast Skapa poolspel – påverkar inte övriga sidor. */
    .pool-create-page .pool-settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 20px;
      margin-top: 18px;
    }
    .pool-create-page .pool-setting { min-width: 0; }
    .pool-create-page .pool-setting label {
      display: block;
      margin: 0 0 7px;
    }
    .pool-create-page .pool-setting input,
    .pool-create-page .pool-setting select {
      box-sizing: border-box;
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0;
      min-height: 46px;
    }
    .pool-create-page .pool-save-area { margin-top: 22px; }
    .pool-create-page #savePool:not([hidden]) {
      display: block;
      width: 100%;
      min-height: 52px;
      background: linear-gradient(180deg, #dc1735, #a60d25);
      color: white;
      border-radius: 13px;
      font-weight: 700;
    }
    @media (max-width: 650px) {
      .pool-create-page .pool-settings-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 13px;
      }
      .pool-create-page .pool-setting input,
      .pool-create-page .pool-setting select { min-height: 44px; }
    }
  </style>
</head>
<body class="pool-create-page">
  <div class="wrap">
    <nav class="mainmenu">
      <a href="../startsida/">Startsida</a>
      <a href="../truppen/">Truppen</a>
      <a href="../skapapoolspel/" class="active">Skapa poolspel</a>
      <a href="../malvaktsstatistik/">Målvaktsstatistik</a>
      <a href="../bytesschema/">Bytesschema</a>
      <a href="../matchvy/">Matchvy</a>
      <a href="../lag/">Lag</a>
    </nav>

    <section class="hero-card">
      <img src="../icon-192.png" alt="NSK" class="hero-logo">
      <div>
        <h1 class="hero-title">Skapa poolspel</h1>
        <div class="hero-sub">Ställ in ort, datum och förutsättningar</div>
      </div>
    </section>

    <section class="card">
      <h2>Förutsättningar</h2>

      <div class="pool-settings-grid">
        <div class="pool-setting">
          <label for="poolPlace">Ort</label>
          <input id="poolPlace" type="text" placeholder="t.ex. Gnesta">
        </div>
        <div class="pool-setting">
          <label for="poolHall">Ishallens namn</label>
          <input id="poolHall" type="text" maxlength="150" placeholder="t.ex. Rosvalla">
        </div>
        <div class="pool-setting">
          <label for="poolDate">Datum</label>
          <input id="poolDate" type="date">
        </div>
        <div class="pool-setting">
          <label for="teams">Antal lag</label>
          <select id="teams">
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
        </div>
        <div class="pool-setting">
          <label for="matches">Antal matcher</label>
          <select id="matches">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4" selected>4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                </select>
        </div>
        <div class="pool-setting">
          <label for="players">Spelare på planen</label>
          <select id="players">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
        </div>
        <div class="pool-setting">
          <label for="periods">Antal perioder</label>
          <select id="periods">
                  <option value="1" selected>1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
        </div>
        <div class="pool-setting">
          <label for="periodTime">Periodtid (min)</label>
          <select id="periodTime">
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15" selected>15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18">18</option>
                  <option value="19">19</option>
                  <option value="20">20</option>
                </select>
        </div>
        <div class="pool-setting">
          <label for="subTime">Bytestid (sek)</label>
          <select id="subTime">
                  <option value="60">60</option>
                  <option value="75">75</option>
                  <option value="90" selected>90</option>
                  <option value="120">120</option>
                </select>
        </div>
      </div>

      <div class="pool-save-area">
        <button id="savePool" class="nsk-action nsk-action--save" type="button" hidden disabled>Spara poolspel</button>
        <div id="poolMsg" class="small"></div>
      </div>
    </section>

    <section class="card">
      <h2>Laguppställning</h2>
      <div class="small">Välj lag för att skapa laguppställning</div>
      <div id="lagButtons" class="team-buttons"></div>
    </section>

    <div id="appError" class="small"></div>
<script>
  document.write('<script src="../config.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../auth.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../db.js?v=' + window.NSK_VERSION + '"><\/script>');
  document.write('<script src="../app.js?v=' + window.NSK_VERSION + '"><\/script>');
</script>
  </div>
<script src="../admin-mode.js?v=1"></script>
<script>
(function(){
 const btn=document.getElementById('savePool');
 async function refresh(){
  const token=localStorage.getItem('nsk_admin_token');
  if(!token){btn.hidden=true;btn.disabled=true;return;}
  try{const r=await fetch('https://nsk-api.peter-hasselberg.workers.dev/api/admin/status',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const data=await r.json();btn.hidden=!data.admin;btn.disabled=!data.admin;}catch{btn.hidden=true;btn.disabled=true;}
 }
 window.addEventListener('storage',refresh);
 document.addEventListener('click',()=>setTimeout(refresh,250));
 refresh();
})();
</script>
</body>
</html>
